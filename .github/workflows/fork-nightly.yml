name: fork nightly

# Le canal fork d'Orca, entretenu tout seul. Lis README.md sur cette branche
# d'abord : il explique pourquoi la branche par défaut ne contient pas de code,
# quelle ref la CI possède, et par où on sort de ce dispositif.
#
# Ce fichier ne vit QUE sur `fork-pipeline`. `schedule` ne se déclenche que
# depuis la branche par défaut du dépôt.
#
# La source est la branche d'intégration du fork complet. Chaque nuit épingle
# UNE release stable d'upstream et la MERGE (jamais de rebase) : l'ascendance
# que l'installeur exige est préservée par construction. Un conflit est
# résolu par un humain ; aucun chemin ne force-pushe une branche.

on:
  schedule:
    # 04:30 UTC = 06:30 Paris l'été, 05:30 l'hiver. Un seul cron, pas de jumeau
    # DST : ce qui compte est « avant que Flo ouvre la machine », pas l'heure
    # exacte. Minute 30 pour ne pas se coller à la vague de crons de minute 0.
    - cron: '30 4 * * *'
  workflow_dispatch:
    inputs:
      force:
        description: Builder même si la source publiée n'a pas bougé
        type: boolean
        default: false
      source_ref:
        description: >-
          Builder CE ref de CE dépôt tel quel (branche, tag ou sha) : aucun
          merge. Les gardes d'ascendance s'appliquent, et une publication
          avance `fork-channel` comme une nightly. Vide = nightly.
        type: string
        default: ''

# Lecture par défaut ; seul le job `release` demande `contents: write`, et les
# écritures de refs passent par le PAT (GITHUB_TOKEN n'a pas le scope
# `workflow`, et l'arbre buildé contient les ~30 workflows d'upstream).
permissions:
  contents: read

# Pas de cancel-in-progress : un run annulé au milieu laisse un tag sans
# artefacts, et deux runs concurrents se disputeraient l'avance des refs.
concurrency:
  group: fork-nightly
  cancel-in-progress: false

env:
  # LA source de vérité : la branche d'intégration du fork complet. Elle
  # contient le fork ENTIER (personnalisations incluses) et son historique
  # descend de tout ce que le canal a déjà publié. Réglable sans commit :
  # Settings > Secrets and variables > Actions > Variables > SOURCE_BRANCH.
  SOURCE_BRANCH: ${{ vars.SOURCE_BRANCH || 'fix/fork-v1.4.203' }}
  # Le plancher d'ascendance : toute source doit le contenir, ce qui refuse
  # avant le tag un build d'upstream nu ou une lignée abandonnée du fork.
  FORK_BASE_REF: ${{ vars.FORK_BASE_REF || 'feat/fork-1.4.200' }}
  # Le pointeur « dernier build publié avec succès ». Avancé en fast-forward
  # SEUL (jamais de force) par le job `release`, après que tests et packaging
  # soient verts. C'est lui, et rien d'autre, qui interdit une régression
  # d'ascendance : un build qui ne le contient pas ne se publie pas.
  CHANNEL_BRANCH: fork-channel
  UPSTREAM_REPO: stablyai/orca
  UPSTREAM_URL: https://github.com/stablyai/orca.git
  # Le Mac a mesuré que Node 22 casse le packaging de node-pty et que 24.11.1
  # passe. `engines.node` du dépôt dit « 24 », ce qui flotterait sur la dernière
  # 24.x : on épingle la version exacte que ce canal a exercée.
  NODE_VERSION: 24.11.1

jobs:
  # ---------------------------------------------------------------------------
  # 1. Choisir la source, la vérifier, la tagger. Le seul job qui décide QUOI
  #    est buildé. Il n'écrit aucune branche : il crée un tag immuable, et
  #    c'est `release` qui fait avancer les branches publiées, une fois vert.
  # ---------------------------------------------------------------------------
  source:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: read
    outputs:
      should_build: ${{ steps.prepare.outputs.should_build }}
      sha: ${{ steps.prepare.outputs.sha }}
      tag: ${{ steps.tag.outputs.tag }}
      version: ${{ steps.prepare.outputs.version }}
      mode: ${{ steps.inputs.outputs.mode }}
      source_ref: ${{ steps.inputs.outputs.source_ref }}
      # `source` = la branche d'intégration du fork ; `channel` = la pointe
      # publiée, utilisée quand `SOURCE_BRANCH` n'existe pas (variable périmée
      # après un bump de version, typiquement). Aucune autre valeur.
      base_kind: ${{ steps.inputs.outputs.base_kind }}
      # La release stable d'upstream, épinglée UNE fois par run : le merge et la
      # garde d'ascendance lisent la même valeur, jamais deux requêtes.
      upstream_tag: ${{ steps.prepare.outputs.upstream_tag }}
      upstream_sha: ${{ steps.prepare.outputs.upstream_sha }}
      upstream_version: ${{ steps.prepare.outputs.upstream_version }}
      # Le build publié précédent (pointeur de canal, ou à défaut le commit
      # CIBLÉ PAR LE TAG de la dernière release fork — le commit, pas la date).
      previous_sha: ${{ steps.prepare.outputs.previous_sha }}
      previous_origin: ${{ steps.prepare.outputs.previous_origin }}
      # `release` n'avance `SOURCE_BRANCH` que si c'est bien d'elle que vient la
      # source de ce run (et jamais sur le chemin manuel).
      advance_source_branch: ${{ steps.prepare.outputs.advance_source_branch }}
    steps:
      # -----------------------------------------------------------------------
      # Quelle source, et est-elle atteignable. Avant tout checkout : un
      # `SOURCE_BRANCH` périmé ferait échouer `actions/checkout` sur un message
      # qui ne dit pas quoi régler.
      # -----------------------------------------------------------------------
      - name: Résoudre la source demandée
        id: inputs
        env:
          GH_TOKEN: ${{ github.token }}
          PUSH_TOKEN: ${{ secrets.FORK_PUSH_TOKEN }}
          SOURCE_REF: ${{ inputs.source_ref }}
        run: |
          set -euo pipefail

          # Sans PAT, ce run ne peut ni tagger ni faire avancer un ref : il
          # builderait 90 minutes pour rien. On échoue fermé, tout de suite.
          if [ -z "${PUSH_TOKEN:-}" ]; then
            {
              echo "### Secret manquant — impossible de poser le tag de build"
              echo
              echo '```bash'
              echo "gh secret set FORK_PUSH_TOKEN --repo $GITHUB_REPOSITORY"
              echo '```'
              echo
              echo "PAT classic, scopes \`repo\` + \`workflow\`. GITHUB_TOKEN ne suffit pas :"
              echo "l'arbre buildé contient les workflows d'upstream."
            } >>"$GITHUB_STEP_SUMMARY"
            echo "::error::FORK_PUSH_TOKEN absent — gh secret set FORK_PUSH_TOKEN --repo $GITHUB_REPOSITORY"
            exit 1
          fi

          read_remote="https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"

          if [ -n "${SOURCE_REF:-}" ]; then
            # Validation bornée : une branche, un tag ou un sha de CE dépôt, et
            # rien d'autre. Pas d'URL, pas de `owner/repo:ref`, pas de `refs/…`
            # (refs/pull/N/head est un ref de ce dépôt qui n'est pas à lui), pas
            # de révision calculée (`~`, `^`, `..`) qui dépendrait du moment de
            # la lecture.
            if ! printf '%s' "$SOURCE_REF" | grep -Eq '^[A-Za-z0-9][A-Za-z0-9._/-]{0,199}$' \
              || printf '%s' "$SOURCE_REF" | grep -Eq '\.\.|^refs/'; then
              echo "::error::source_ref refusé : « $SOURCE_REF » n'est ni une branche, ni un tag, ni un sha de ce dépôt"
              exit 1
            fi
            {
              echo "mode=manual"
              echo "source_ref=$SOURCE_REF"
              echo "base_kind=manual"
              echo "checkout_ref=$SOURCE_REF"
            } >>"$GITHUB_OUTPUT"
            echo "Chemin manuel : build de « $SOURCE_REF » tel quel."
            exit 0
          fi

          # Chemin nocturne. La base est la branche d'intégration du fork ; à
          # défaut, la pointe publiée : `SOURCE_BRANCH` porte un numéro de
          # version et DEVIENDRA périmée, et la nuit qui suit ne doit pas
          # mourir sur une erreur de checkout. Le sha est figé ICI, une fois :
          # tout l'aval build ce commit, même si la branche avance pendant le run.
          # Un `ls-remote` qui échoue autrement que « ref absent » (code 2) est
          # une erreur, jamais un repli silencieux.
          resolve_head() { # $1 branche -> sha sur stdout ; 2 = absente
            local out rc=0
            out="$(git ls-remote --exit-code --heads "$read_remote" "refs/heads/$1")" || rc=$?
            [ "$rc" -eq 0 ] || return "$rc"
            printf '%s' "$out" | awk 'NR==1 {print $1}'
          }
          for base_kind in source channel; do
            case "$base_kind" in source) branch="$SOURCE_BRANCH" ;; channel) branch="$CHANNEL_BRANCH" ;; esac
            rc=0; head_sha="$(resolve_head "$branch")" || rc=$?
            if [ "$rc" -eq 2 ]; then continue; fi
            if [ "$rc" -ne 0 ] || ! printf '%s' "$head_sha" | grep -Eq '^[0-9a-f]{40}$'; then
              echo "::error::impossible de lire $branch sur $GITHUB_REPOSITORY (code $rc) — on ne devine pas une source"
              exit 1
            fi
            if [ "$base_kind" = channel ]; then
              {
                echo "### \`SOURCE_BRANCH\` introuvable — repli sur la pointe publiée"
                echo
                echo "\`$SOURCE_BRANCH\` n'existe pas sur \`$GITHUB_REPOSITORY\`. Ce run build"
                echo "\`$CHANNEL_BRANCH\` (le dernier build publié) et **n'avance pas**"
                echo "\`$SOURCE_BRANCH\`. Chaque nuit de repli fait avancer \`$CHANNEL_BRANCH\` seul :"
                echo "avant de rétablir la variable, fusionne la pointe publiée dans la branche"
                echo "d'intégration, sinon la première nuit rétablie est refusée pour perte"
                echo "d'ascendance publiée."
                echo
                echo '```bash'
                echo "git fetch origin $CHANNEL_BRANCH <branche-fork-complète>"
                echo "git switch -c reconcile/$CHANNEL_BRANCH origin/<branche-fork-complète>"
                echo "git merge origin/$CHANNEL_BRANCH && git push origin HEAD:<branche-fork-complète>"
                echo "gh variable set SOURCE_BRANCH --repo $GITHUB_REPOSITORY --body <branche-fork-complète>"
                echo '```'
              } >>"$GITHUB_STEP_SUMMARY"
              echo "::warning::$SOURCE_BRANCH absente — repli sur $CHANNEL_BRANCH"
            fi
            {
              echo "mode=nightly"
              echo "source_ref="
              echo "base_kind=$base_kind"
              echo "base_branch=$branch"
              echo "checkout_ref=$head_sha"
            } >>"$GITHUB_OUTPUT"
            echo "Base : $branch figée sur $head_sha."
            exit 0
          done

          {
            echo "### Aucune source — ni branche d'intégration, ni canal publié"
            echo
            echo "Ni \`$SOURCE_BRANCH\` ni \`$CHANNEL_BRANCH\` n'existent sur"
            echo "\`$GITHUB_REPOSITORY\`. Le canal ne devine pas une source :"
            echo
            echo '```bash'
            echo "gh variable set SOURCE_BRANCH --repo $GITHUB_REPOSITORY --body <branche-fork-complète>"
            echo '```'
          } >>"$GITHUB_STEP_SUMMARY"
          echo "::error::ni $SOURCE_BRANCH ni $CHANNEL_BRANCH n'existent — aucune source"
          exit 1

      - name: Checkout de la source
        uses: actions/checkout@v6
        with:
          path: src
          ref: ${{ steps.inputs.outputs.checkout_ref }}
          # Les gardes comparent des ascendances : un historique tronqué les
          # rendrait toutes fausses (et `--is-ancestor` répondrait « non » sur
          # un greffon).
          fetch-depth: 0
          # Sinon checkout pose un http.extraheader avec GITHUB_TOKEN, qui prime
          # sur les identifiants de l'URL de push : 403 github-actions[bot].
          persist-credentials: false

      # -----------------------------------------------------------------------
      # Le cœur. Épingler la release stable, l'intégrer par MERGE (jamais par
      # rebase), puis refuser de tagger toute source qui perdrait de
      # l'ascendance déjà publiée.
      # -----------------------------------------------------------------------
      - name: Préparer et vérifier la source
        id: prepare
        working-directory: src
        env:
          GH_TOKEN: ${{ github.token }}
          MODE: ${{ steps.inputs.outputs.mode }}
          BASE_KIND: ${{ steps.inputs.outputs.base_kind }}
          BASE_BRANCH: ${{ steps.inputs.outputs.base_branch }}
          SOURCE_REF: ${{ steps.inputs.outputs.source_ref }}
          FORCED: ${{ github.event_name == 'workflow_dispatch' && inputs.force }}
        run: |
          set -euo pipefail
          git config user.name 'orca fork pipeline'
          git config user.email 'fork-pipeline@users.noreply.github.com'

          read_remote="https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"

          # `--is-ancestor` répond 0 pour un ancêtre ET pour l'égalité : c'est
          # exactement la relation que l'installeur exige (descendant, ou égal).
          contains() { git merge-base --is-ancestor "$1" "$2"; }

          # --- 1. la release stable d'upstream, épinglée UNE fois -------------
          # Une RELEASE, pas `upstream/main` : `main` est une pointe mouvante
          # qui n'a rien promis. `releases/latest` est par définition la
          # dernière non-brouillon non-prerelease ; la forme `vX.Y.Z` écarte
          # ce qui n'est pas une release desktop. La date ne décide de rien :
          # les gardes plus bas exigent que le résultat contienne la pointe déjà
          # publiée, donc un choix trop vieux ne peut pas rétrograder le canal.
          upstream_tag="$(gh api "repos/$UPSTREAM_REPO/releases/latest" --jq '.tag_name // empty')"
          if ! printf '%s' "$upstream_tag" | grep -Eq '^v[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "::error::releases/latest de $UPSTREAM_REPO n'est pas une release desktop vX.Y.Z (« $upstream_tag ») — on ne build pas une source non épinglée"
            exit 1
          fi
          git remote add upstream "$UPSTREAM_URL"
          git fetch --no-tags --quiet upstream "+refs/tags/$upstream_tag:refs/fork/stable"
          # `^{commit}` : un tag annoté ne résout pas en commit tout seul, et
          # toutes les gardes d'en dessous comparent des commits.
          upstream_sha="$(git rev-parse 'refs/fork/stable^{commit}')"
          upstream_version="$(git show 'refs/fork/stable:package.json' | node -e 'let s="";process.stdin.on("data",c=>s+=c).on("end",()=>console.log(JSON.parse(s).version??""))')"
          echo "Release stable épinglée : $upstream_tag ($upstream_sha, version ${upstream_version:-inconnue})"

          # --- 2. le plancher d'ascendance du fork ---------------------------
          if git fetch --no-tags --quiet "$read_remote" "+refs/heads/$FORK_BASE_REF:refs/fork/base" 2>/dev/null; then
            :
          elif git fetch --no-tags --quiet "$read_remote" "+refs/tags/$FORK_BASE_REF:refs/fork/base" 2>/dev/null; then
            :
          else
            {
              echo "### \`FORK_BASE_REF\` introuvable"
              echo
              echo "\`$FORK_BASE_REF\` n'est ni une branche ni un tag de"
              echo "\`$GITHUB_REPOSITORY\`. Cette ref est le plancher qui prouve qu'une"
              echo "source est bien ce fork : sans elle, la garde ne garde rien, donc"
              echo "le run s'arrête ici plutôt que de publier sans plancher."
              echo
              echo '```bash'
              echo "gh variable set FORK_BASE_REF --repo $GITHUB_REPOSITORY --body <branche-ou-tag-de-base>"
              echo '```'
            } >>"$GITHUB_STEP_SUMMARY"
            echo "::error::FORK_BASE_REF « $FORK_BASE_REF » introuvable sur $GITHUB_REPOSITORY"
            exit 1
          fi
          fork_base_sha="$(git rev-parse 'refs/fork/base^{commit}')"

          # --- 3. le build publié, la référence à ne pas perdre ----------------
          # Le pointeur de canal n'avance qu'en fast-forward : il ne peut pas
          # mentir sur ce qui a été publié. Il est posé UNE fois à la main sur
          # le commit du build installé — la CI ne le devine pas depuis la liste
          # des releases : les anciennes releases rebasées ne descendent de
          # rien, et une date ne prouve rien. Un `ls-remote` qui échoue autrement
          # que « ref absent » (code 2) est une erreur, jamais un repli.
          rc=0
          git ls-remote --exit-code --heads "$read_remote" "refs/heads/$CHANNEL_BRANCH" >/dev/null || rc=$?
          if [ "$rc" -eq 2 ]; then
            {
              echo "### \`$CHANNEL_BRANCH\` absent — le canal n'est pas amorcé"
              echo
              echo "Pose-le une fois sur le commit du build INSTALLÉ (lu dans"
              echo "\`/Applications/Orca.app/Contents/Resources/fork-channel.txt\`, ligne \`sha=\`) :"
              echo
              echo '```bash'
              echo "gh api --method POST repos/$GITHUB_REPOSITORY/git/refs -f ref=refs/heads/$CHANNEL_BRANCH -f sha=<sha-installé>"
              echo '```'
            } >>"$GITHUB_STEP_SUMMARY"
            echo "::error::$CHANNEL_BRANCH absent sur $GITHUB_REPOSITORY — pose-le sur le commit du build installé (résumé du run)"
            exit 1
          elif [ "$rc" -ne 0 ]; then
            echo "::error::impossible de lire $CHANNEL_BRANCH sur $GITHUB_REPOSITORY (code $rc) — la garde d'ascendance publiée ne peut pas être évaluée"
            exit 1
          fi
          git fetch --no-tags --quiet "$read_remote" "+refs/heads/$CHANNEL_BRANCH:refs/fork/prev"
          previous_sha="$(git rev-parse 'refs/fork/prev^{commit}')"
          previous_origin="branch:$CHANNEL_BRANCH"
          echo "Build publié précédent : $previous_sha (via $previous_origin)"

          # --- 4. intégrer la release stable ---------------------------------
          # MERGE, pas rebase. Le rebase réécrit les SHA, donc le résultat n'est
          # jamais un descendant du build précédent : c'est précisément ce qui
          # cassait la mise à jour. Le merge, lui, contient les deux parents —
          # la lignée du fork ET celle de la release — par construction.
          advance_source_branch=false
          if [ "$MODE" = "manual" ]; then
            build_sha="$(git rev-parse HEAD)"
            echo "Chemin manuel : aucune intégration, la source est prise telle quelle ($build_sha)."
          else
            base_sha="$(git rev-parse HEAD)"
            if contains "$upstream_sha" "$base_sha"; then
              echo "$upstream_tag est déjà intégré dans la base ($base_sha) — rien à merger."
              build_sha="$base_sha"
            else
              # Pas de `-X ours`, pas de `-X theirs`, pas de `-s ours`. Une
              # stratégie qui choisit un côté résout le conflit en JETANT du
              # code que personne n'a relu : soit le correctif amont, soit une
              # personnalisation. Le conflit est un travail humain de 5–15 min,
              # une fois par release ; le silence d'une résolution automatique
              # coûterait un binaire amputé qu'aucun gate ne peut voir.
              set +e
              git merge --no-ff --no-edit \
                -m "merge: upstream $upstream_tag into ${BASE_BRANCH}" refs/fork/stable
              merge_status=$?
              set -e
              if [ $merge_status -ne 0 ]; then
                unresolved="$(git diff --name-only --diff-filter=U || true)"
                {
                  echo "### Conflit d'intégration — résolution humaine requise"
                  echo
                  echo "\`$upstream_tag\` (\`${upstream_sha:0:12}\`) ne s'intègre pas tout seul dans"
                  echo "\`$SOURCE_BRANCH\` (\`${base_sha:0:12}\`). **Rien n'a été publié** : pas de"
                  echo "merge, pas de tag, pas de release, et aucun ref n'a bougé."
                  echo
                  echo "Fichiers en conflit :"
                  echo '```'
                  if [ -n "$unresolved" ]; then echo "$unresolved"; else echo "(aucun chemin listé — voir le log du run)"; fi
                  echo '```'
                  echo
                  echo "Résous-le sur la branche d'intégration, en local :"
                  echo
                  echo '```bash'
                  echo "git fetch origin $SOURCE_BRANCH"
                  echo "git fetch $UPSTREAM_URL refs/tags/$upstream_tag:refs/tags/$upstream_tag"
                  echo "git switch -c integrate/$upstream_tag origin/$SOURCE_BRANCH"
                  echo "git merge $upstream_tag   # résous les fichiers ci-dessus, puis commit"
                  echo "git push origin HEAD:$SOURCE_BRANCH   # fast-forward, jamais --force"
                  echo '```'
                  echo
                  echo "La nuit suivante repart de ce merge : \`$upstream_tag\` y est déjà"
                  echo "intégré, donc elle n'a plus rien à fusionner."
                } >>"$GITHUB_STEP_SUMMARY"
                echo "::error::conflit d'intégration $upstream_tag dans $SOURCE_BRANCH sur : $(echo "$unresolved" | tr '\n' ' ')"
                git merge --abort || true
                exit 1
              fi
              build_sha="$(git rev-parse HEAD)"
              echo "Merge $upstream_tag dans $SOURCE_BRANCH : $build_sha"
            fi
            # Le résultat contient la tête de `SOURCE_BRANCH` : l'avancer est un
            # fast-forward. Sur le repli `channel`, on ne crée pas une branche
            # nommée d'après une variable périmée.
            if [ "$BASE_KIND" = "source" ]; then
              advance_source_branch=true
            fi
          fi

          # --- 5. les gardes d'ascendance, avant tout tag ---------------------
          # Elles s'appliquent aux DEUX chemins : un dispatch manuel n'achète
          # aucune dispense. Chacune est une relation d'ascendance sur des
          # commits — aucune date, aucun horodatage de tag, aucun nom de ref.
          if ! contains "$fork_base_sha" "$build_sha"; then
            {
              echo "### Source refusée — ce n'est pas ce fork"
              echo
              echo "La source (\`${build_sha:0:12}\`) ne contient pas \`$FORK_BASE_REF\`"
              echo "(\`${fork_base_sha:0:12}\`), le plancher d'ascendance du fork."
              echo
              echo "Ce que ça veut dire en pratique : soit la source appartient à une"
              echo "**lignée abandonnée** (l'ancienne lignée patch, entièrement"
              echo "superposée par le port actuel), soit c'est un build d'upstream"
              echo "sans les personnalisations. Les deux publieraient un binaire qui"
              echo "n'est pas le fork qu'on installe."
              echo
              echo '```bash'
              echo "# builder le fork complet :"
              echo "gh workflow run fork-nightly.yml --repo $GITHUB_REPOSITORY --ref fork-pipeline"
              echo
              echo "# ou, si le plancher a légitimement changé de nom :"
              echo "gh variable set FORK_BASE_REF --repo $GITHUB_REPOSITORY --body <nouvelle-base>"
              echo '```'
            } >>"$GITHUB_STEP_SUMMARY"
            echo "::error::source refusée : ${build_sha:0:12} ne contient pas FORK_BASE_REF $FORK_BASE_REF — aucun tag posé"
            exit 1
          fi

          if ! contains "$upstream_sha" "$build_sha"; then
            {
              echo "### Source refusée — la release stable n'est pas dedans"
              echo
              echo "La source (\`${build_sha:0:12}\`) ne contient pas \`$upstream_tag\`"
              echo "(\`${upstream_sha:0:12}\`), la dernière release stable d'upstream."
              echo
              echo "Un canal qui publie une source antérieure à la stable courante"
              echo "installe une régression d'upstream sous un tag plus récent."
              echo
              echo '```bash'
              echo "# intégrer la stable dans la branche fork, puis relancer :"
              echo "git fetch origin $SOURCE_BRANCH"
              echo "git fetch $UPSTREAM_URL refs/tags/$upstream_tag:refs/tags/$upstream_tag"
              echo "git switch -c integrate/$upstream_tag origin/$SOURCE_BRANCH"
              echo "git merge $upstream_tag && git push origin HEAD:$SOURCE_BRANCH"
              echo '```'
            } >>"$GITHUB_STEP_SUMMARY"
            echo "::error::source refusée : ${build_sha:0:12} ne contient pas $upstream_tag — aucun tag posé"
            exit 1
          fi

          if ! contains "$previous_sha" "$build_sha"; then
            {
              echo "### Source refusée — elle perdrait de l'ascendance publiée"
              echo
              echo "Le build publié (\`${previous_sha:0:12}\`, via \`$previous_origin\`) n'est **pas**"
              echo "un ancêtre de la source (\`${build_sha:0:12}\`)."
              echo
              echo "L'installeur exige une preuve d'ascendance stricte : descendant, ou"
              echo "égal. Publier ça livrerait un build qu'aucune machine déjà à jour ne"
              echo "pourrait installer, et qui ferait disparaître du code déjà livré."
              echo "**Aucun ref n'a bougé, aucun tag n'a été posé.**"
              echo
              echo "Deux lignées qui avancent en parallèle se réconcilient par un merge,"
              echo "explicitement, à la main — jamais par un force-push de la CI :"
              echo
              echo '```bash'
              echo "git fetch origin $SOURCE_BRANCH $CHANNEL_BRANCH"
              echo "git switch -c reconcile/$CHANNEL_BRANCH origin/$SOURCE_BRANCH"
              echo "git merge origin/$CHANNEL_BRANCH   # ou chaque commit ci-dessus si le canal n'existe pas"
              echo "git push origin HEAD:$SOURCE_BRANCH"
              echo '```'
            } >>"$GITHUB_STEP_SUMMARY"
            echo "::error::source refusée : ${build_sha:0:12} ne descend pas du build publié ${previous_sha:0:12} — aucun tag posé"
            exit 1
          fi

          # --- 6. fraîcheur : par SHA, pas par date --------------------------
          # Rien à faire seulement si ce commit exact est déjà publié — le
          # pointeur de canal ne suffit pas : il avance avant que la release
          # existe, et une release qui a échoué doit être retentée. Un dispatch
          # manuel est par définition une décision de builder.
          should_build=true
          if [ "$MODE" = "nightly" ] && [ "$FORCED" != "true" ] && [ "$build_sha" = "$previous_sha" ]; then
            # Liste en variable : un `| grep -q` sous pipefail peut rendre le
            # SIGPIPE de gh et faire rebuilder un commit déjà publié.
            published="$(gh release list --repo "$GITHUB_REPOSITORY" --limit 30 --exclude-drafts --json tagName --jq '.[] | .tagName')"
            case "$published" in *"-${build_sha:0:12}"*) should_build=false ;; esac
          fi

          version="$(node -p "require('./package.json').version")"
          # La version part dans $GITHUB_OUTPUT et dans les notes de release :
          # une forme bornée, ou rien.
          if ! printf '%s' "$version" | grep -Eq '^[0-9A-Za-z][0-9A-Za-z.+-]{0,63}$'; then
            echo "::error::package.json de $build_sha n'a pas de version lisible (« $version »)"
            exit 1
          fi
          # On ne fait pas échouer là-dessus : le fork peut légitimement porter
          # une version à lui. Mais un écart non dit ferait croire qu'une
          # release stable est embarquée alors que le bump ne l'est pas.
          if [ -n "$upstream_version" ] && [ "$version" != "$upstream_version" ]; then
            echo "::warning::version de la source ($version) ≠ version de $upstream_tag ($upstream_version)"
          fi

          {
            echo "should_build=$should_build"
            echo "sha=$build_sha"
            echo "version=$version"
            echo "upstream_tag=$upstream_tag"
            echo "upstream_sha=$upstream_sha"
            echo "upstream_version=$upstream_version"
            echo "previous_sha=$previous_sha"
            echo "previous_origin=$previous_origin"
            echo "advance_source_branch=$advance_source_branch"
          } >>"$GITHUB_OUTPUT"

          {
            echo "### Source retenue"
            echo
            echo "- mode : \`$MODE\`${SOURCE_REF:+ (\`$SOURCE_REF\`)}"
            echo "- base : \`$BASE_KIND\` — \`$SOURCE_BRANCH\` / \`$CHANNEL_BRANCH\`"
            echo "- release stable épinglée : \`$upstream_tag\` (\`${upstream_sha:0:12}\`)"
            echo "- plancher fork : \`$FORK_BASE_REF\` (\`${fork_base_sha:0:12}\`) — contenu"
            echo "- build publié précédent : \`${previous_sha:0:12}\` (via \`$previous_origin\`) — contenu"
            echo "- source buildée : \`$build_sha\` (version \`$version\`)"
            echo "- build : \`$should_build\`"
          } >>"$GITHUB_STEP_SUMMARY"
          if [ "$should_build" != "true" ]; then
            echo "Identique au build publié — rien à faire."
          fi

      # -----------------------------------------------------------------------
      # Le tag immuable. Tout l'aval consomme le TAG, jamais une branche : si
      # une branche bouge pendant le run, le build ne bouge pas. Le tag est
      # aussi ce qui garde vivant le commit de merge tant qu'aucun ref ne le
      # pointe (les refs avancent dans `release`, une fois vert).
      # -----------------------------------------------------------------------
      - name: Poser le tag de build
        id: tag
        if: steps.prepare.outputs.should_build == 'true'
        working-directory: src
        env:
          FORK_PUSH_TOKEN: ${{ secrets.FORK_PUSH_TOKEN }}
          SHA: ${{ steps.prepare.outputs.sha }}
          VERSION: ${{ steps.prepare.outputs.version }}
        run: |
          set -euo pipefail
          sha="$SHA"
          # Même forme de tag que jusqu'ici : `update.sh` et `versions.yml`
          # n'ont qu'un `kind` à connaître, et surtout pas deux conventions.
          # L'horodatage du NOM est décoratif — aucune garde ne le lit.
          tag="fork-$(date -u +%Y%m%d-%H%M)-${sha:0:12}"
          # Construit depuis $GITHUB_REPOSITORY : ce job ne peut écrire que sur
          # CE dépôt. Le remote `upstream` ne sert qu'au fetch.
          remote="https://x-access-token:${FORK_PUSH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          existing="$(git ls-remote --tags "$remote" "refs/tags/$tag" | awk '{print $1}')"
          if [ -n "$existing" ]; then
            # Idempotent si c'est le MÊME sha (relance d'un run) ; sinon on
            # refuse d'écraser un tag que des artefacts référencent peut-être.
            if [ "$existing" != "$sha" ]; then
              echo "::error::le tag $tag existe déjà sur $existing — attends une minute et relance"
              exit 1
            fi
            echo "Tag $tag déjà posé sur ce sha — réutilisé."
          else
            # Un push de tag, jamais de branche, jamais de --force.
            git push "$remote" "$sha:refs/tags/$tag"
            echo "Tag $tag créé sur $sha."
          fi
          echo "tag=$tag" >>"$GITHUB_OUTPUT"
          {
            echo "- tag immuable : \`$tag\` (version \`$VERSION\`)"
          } >>"$GITHUB_STEP_SUMMARY"

  # ---------------------------------------------------------------------------
  # 2. Les tests ciblés, le typecheck complet, et les deux gates qui gardent ce
  #    qu'on livre : l'app construite doit booter sans qu'un error boundary
  #    tire, et les compteurs de quota perso doivent être dans la source et
  #    passer. Les suites unitaires mockent le store ; un sélecteur qui alloue
  #    son snapshot (React #185, build 6feef259b9f5 : barre d'état vide, 4
  #    crashs/s) ne se voit qu'en app réelle.
  # ---------------------------------------------------------------------------
  test:
    needs: source
    if: needs.source.outputs.should_build == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      NODE_OPTIONS: --max-old-space-size=4096
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ needs.source.outputs.tag }}
          persist-credentials: false
      - uses: pnpm/action-setup@v6
        with:
          run_install: false
      - uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      # Le postinstall des modules natifs échoue avec la copie de node-gyp
      # embarquée par pnpm sur les runners Linux (cf. release-cut.yml amont).
      - name: node-gyp externe
        run: |
          npm install -g node-gyp@11.5.0
          echo "npm_config_node_gyp=$(npm root -g)/node-gyp/bin/node-gyp.js" >>"$GITHUB_ENV"
      - name: Install
        run: pnpm install --frozen-lockfile
      - name: Typecheck
        run: pnpm run typecheck
      # Ciblé, pas la suite entière : une suite complète de ~2000 tests
      # transformerait une boucle nocturne en source de faux rouges venus
      # d'ailleurs. Si tu customises ailleurs, élargis cette liste — sinon tu
      # build vert sur du code que rien n'exerce.
      - name: Tests orchestration + rpc
        run: |
          node config/scripts/ensure-native-runtime.mjs --runtime=node
          pnpm exec vitest run --config config/vitest.config.ts \
            src/main/runtime/orchestration src/main/runtime/rpc

      - name: Checkout la branche de pilotage (gates)
        uses: actions/checkout@v6
        with:
          path: pipeline
          sparse-checkout: gates
          persist-credentials: false
      - name: Xvfb
        run: sudo apt-get update && sudo apt-get install -y xvfb
      - name: Gate renderer - boot sans crash de boundary
        run: |
          cp pipeline/gates/renderer-boot-crash-free.spec.ts tests/e2e/
          pnpm run ensure:electron-runtime
          xvfb-run --auto-servernum env ORCA_E2E_FORWARD_APP_LOGS=1 \
            pnpm exec playwright test tests/e2e/renderer-boot-crash-free.spec.ts \
              --config tests/playwright.config.ts --project electron-headless --workers=1

      # Le gate ci-dessus ne prouve que « ça boote ». C'est précisément ce qui a
      # laissé publier un binaire vert et amputé : sans les compteurs de quota,
      # l'app boote parfaitement. Ce gate-ci exécute les specs que la source
      # doit porter. Il n'a PLUS de condition : la source de ce canal est le
      # fork complet, donc elle porte toujours les personnalisations. Un `if:`
      # ici rouvrirait le trou — c'est un état calculé qui décidait s'il faut
      # vérifier, et c'est cet état-là qui s'était trompé.
      - name: Gate perso - les compteurs de quota sont dans la source
        run: |
          set -euo pipefail
          specs=()
          while read -r spec _rest; do
            case "${spec:-}" in
              ''|'#'*) continue ;;
            esac
            specs+=("$spec")
          done <pipeline/gates/custom-meter-specs.txt
          if [ "${#specs[@]}" -eq 0 ]; then
            echo "::error::pipeline/gates/custom-meter-specs.txt ne liste aucun spec — le gate perso ne garderait rien"
            exit 1
          fi
          absent=()
          for spec in "${specs[@]}"; do
            if [ ! -f "$spec" ]; then
              absent+=("$spec")
            fi
          done
          if [ "${#absent[@]}" -gt 0 ]; then
            {
              echo "### Source refusée — le spec des compteurs perso n'est pas dedans"
              echo
              echo "La source de ce canal est le fork complet : elle est censée porter"
              echo "les personnalisations. Ces specs sont absents de l'arbre buildé :"
              echo '```'
              for spec in "${absent[@]}"; do
                echo "$spec"
              done
              echo '```'
              echo "Soit la source n'est pas celle que tu crois, soit la liste de"
              echo "\`gates/custom-meter-specs.txt\` a vieilli (spec renommé)."
            } >>"$GITHUB_STEP_SUMMARY"
            echo "::error::spec(s) perso absent(s) de la source : $(echo "${absent[*]}")"
            exit 1
          fi
          xvfb-run --auto-servernum env ORCA_E2E_FORWARD_APP_LOGS=1 \
            pnpm exec playwright test "${specs[@]}" \
              --config tests/playwright.config.ts --project electron-headless --workers=1
      - name: Traces Playwright du gate
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-traces-gate-renderer
          path: test-results/
          retention-days: 7
          if-no-files-found: ignore

  # ---------------------------------------------------------------------------
  # 3a. macOS arm64, NON signé. La signature est refaite sur le Mac de Flo par
  #     update.sh, avec un certificat local dont la clé privée ne bouge pas :
  #     c'est lui qui porte les grants TCC, aucune CI ne peut le remplacer.
  #
  # Pas de `pnpm install:release` (`--cpu=current,x64,arm64`) : ce job packe
  # arm64 sur un runner arm64, donc aucun slice croisé n'est nécessaire. Le
  # contrat est là si un jour ce canal package les deux arches depuis un seul
  # runner — c'est à ce moment-là qu'il faudra l'utiliser, pas avant.
  # ---------------------------------------------------------------------------
  build-mac:
    needs: [source, test]
    runs-on: macos-15
    timeout-minutes: 90
    env:
      NODE_OPTIONS: --max-old-space-size=4096
      # La provenance inscrite dans l'artefact. `afterPack` d'electron-builder
      # écrit `Resources/orca-local-build.json` avec ce commit, et retombe
      # sinon sur `GITHUB_SHA` — qui vaut ici le sha de `fork-pipeline`, la
      # branche du WORKFLOW. Un artefact prétendait donc être buildé depuis un
      # commit de README. On inscrit le sha de la source réellement buildée,
      # celui que le tag porte.
      ORCA_BUILD_COMMIT: ${{ needs.source.outputs.sha }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ needs.source.outputs.tag }}
          persist-credentials: false
      - uses: pnpm/action-setup@v6
        with:
          run_install: false
      - uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - name: Cache electron-builder
        uses: actions/cache@v5
        with:
          path: |
            ~/Library/Caches/electron
            ~/Library/Caches/electron-builder
          key: electron-builder-mac-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: electron-builder-mac-
      - name: Install
        uses: nick-fields/retry@v4
        with:
          timeout_minutes: 15
          max_attempts: 3
          retry_wait_seconds: 30
          command: pnpm install --frozen-lockfile
      # `build:release` bundle l'app web mobile depuis v1.4.210 ; mobile/ est un projet pnpm à part.
      - uses: ./.github/actions/install-mobile-dependencies
      # local-build-switch.ts:25 refuse un build dont la version égale celle qui
      # tourne. Exportée pour les étapes suivantes : lue au require() de la config.
      - name: Version unique pour le canal local-build
        run: |
          set -euo pipefail
          version="$(node -e 'import("./config/scripts/build-mac-local.mjs").then(m=>console.log(m.getLocalBuildIdentity().version))')"
          test -n "$version"
          echo "ORCA_LOCAL_BUILD_VERSION=$version" >>"$GITHUB_ENV"
          echo "version du build mac : $version"
      # `build:release` construit aussi les trois helpers Swift (computer-use,
      # keyboard-layout, notification-status) que `mac.extraResources` /
      # `extraFiles` exigent : sans eux electron-builder échoue au packaging.
      # Aucun secret de télémétrie n'est fourni, donc ORCA_BUILD_IDENTITY reste
      # nul et le build est muet — ce qu'on veut d'un artefact non officiel.
      - name: Build
        run: pnpm build:release
      - name: Config electron-builder du canal fork
        run: |
          cat >config/electron-builder.fork.config.cjs <<'EOF'
          // Généré par fork-nightly.yml, jamais commité sur la branche source.
          // Voir le README de `fork-pipeline`.
          const base = require('./electron-builder.config.cjs')
          module.exports = {
            ...base,
            // publish: null => aucun app-update.yml dans le bundle. Un build fork
            // qui interroge les releases d'upstream proposerait de s'écraser
            // lui-même avec l'officiel.
            publish: null,
            // Un seul artefact, nommé sans la version : update.sh et
            // versions.yml n'ont alors qu'un `kind` à connaître, pas un nom
            // qui change à chaque bump de package.json.
            mac: {
              ...base.mac,
              artifactName: 'orca-macos-${arch}.${ext}',
              target: [{ target: 'zip', arch: ['arm64'] }]
            }
          }
          EOF
          cat config/electron-builder.fork.config.cjs
      - name: Package (zip arm64, non signé)
        env:
          # Sans ça electron-builder irait chercher une identité Developer ID
          # dans le keychain du runner et échouerait sur son absence.
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
        run: pnpm exec electron-builder --config config/electron-builder.fork.config.cjs --mac zip --arm64 --publish never
      - name: Aucun app-update.yml dans l'artefact
        run: |
          set -euo pipefail
          zip="dist/orca-macos-arm64.zip"
          test -f "$zip" || { echo "::error::$zip absent"; ls -la dist; exit 1; }
          # Liste en variable : `… | grep -q` sous pipefail rend le SIGPIPE du
          # producteur sur une correspondance, donc « présent » passait vert.
          entries="$(unzip -Z1 "$zip")"
          case "$entries" in *app-update.yml*)
            echo "::error::app-update.yml présent dans $zip — le build s'auto-updaterait vers l'officiel"
            exit 1 ;;
          esac
          echo "OK: pas d'app-update.yml. $(du -h "$zip")"
      - name: L'artefact dit de quelle source il vient
        env:
          EXPECTED_SHA: ${{ needs.source.outputs.sha }}
        run: |
          set -euo pipefail
          # L'inscription dans l'artefact et l'attendu viennent du même output
          # de job : on prouve aussi que l'arbre buildé EST ce commit.
          [ "$(git rev-parse HEAD)" = "$EXPECTED_SHA" ] || { echo "::error::le checkout n'est pas $EXPECTED_SHA"; exit 1; }
          zip="dist/orca-macos-arm64.zip"
          # Le chemin exact dépend de `productName` ; on cherche le manifeste
          # où qu'il soit dans le bundle plutôt que de figer `Orca.app/`. `awk`
          # et non `grep | head` : sous `set -euo pipefail`, un manifeste
          # absent ferait sortir l'étape sur le code 1 de grep (ou un SIGPIPE
          # de head) AVANT le diagnostic juste en dessous.
          entry="$(unzip -Z1 "$zip" | awk '/\/Contents\/Resources\/orca-local-build\.json$/ && !found { print; found=1 }')"
          if [ -z "$entry" ]; then
            echo "::error::orca-local-build.json absent de $zip — l'artefact ne dit pas de quelle source il vient"
            exit 1
          fi
          commit="$(unzip -p "$zip" "$entry" | node -e 'let s="";process.stdin.on("data",c=>s+=c).on("end",()=>console.log(JSON.parse(s).commit??""))')"
          if [ "$commit" != "$EXPECTED_SHA" ]; then
            {
              echo "### Provenance de l'artefact macOS incorrecte"
              echo
              echo "- attendu (source buildée, taggée) : \`$EXPECTED_SHA\`"
              echo "- inscrit dans \`$entry\` : \`$commit\`"
              echo
              echo "\`ORCA_BUILD_COMMIT\` n'a pas atteint \`afterPack\` : sans lui la"
              echo "config retombe sur \`GITHUB_SHA\`, le sha de \`fork-pipeline\`."
            } >>"$GITHUB_STEP_SUMMARY"
            echo "::error::provenance mac : l'artefact annonce « $commit » au lieu de $EXPECTED_SHA"
            exit 1
          fi
          echo "OK: l'artefact s'annonce buildé depuis $commit."
      - uses: actions/upload-artifact@v7
        with:
          name: mac-arm64
          path: dist/orca-macos-arm64.zip
          if-no-files-found: error
          retention-days: 7

  # ---------------------------------------------------------------------------
  # 3b. Linux amd64 .deb — ce que le VPS consomme (curl + dpkg).
  #
  # `ubuntu-latest` et non un conteneur `ubuntu:20.04` : c'est la recette de
  # release d'upstream (release-cut.yml, matrice `build`, `os: ubuntu-latest`).
  # Le plancher glibc 2.31 n'est pas tenu par l'image du runner mais par le hook
  # `afterPack` du packager — `verifyLinuxGlibcFloor`, dans
  # config/electron-builder.config.cjs — que la config dérivée hérite via
  # `...base` : un natif compilé contre un symbole plus récent fait échouer le
  # packaging, sur n'importe quel runner.
  #
  # PROVENANCE : `afterPack` d'upstream n'écrit `orca-local-build.json` que
  # pour `darwin` (mesuré : `if (context.electronPlatformName === 'darwin')`).
  # Le `.deb` ne disait donc RIEN de sa source — seul le zip mac était vérifié,
  # et un paquet Linux buildé depuis n'importe quoi passait le contrôle en ne
  # portant aucune affirmation. La config dérivée du canal enveloppe donc
  # `afterPack` pour stamper `resources/orca-fork-build.json`, et une étape le
  # relit dans le paquet. Le stamp vit dans la config générée, jamais dans la
  # source : le comportement de l'app n'est pas modifié.
  # ---------------------------------------------------------------------------
  build-linux:
    needs: [source, test]
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      NODE_OPTIONS: --max-old-space-size=4096
      ORCA_BUILD_COMMIT: ${{ needs.source.outputs.sha }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ needs.source.outputs.tag }}
          persist-credentials: false
      - uses: pnpm/action-setup@v6
        with:
          run_install: false
      - uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - name: node-gyp externe
        run: |
          npm install -g node-gyp@11.5.0
          echo "npm_config_node_gyp=$(npm root -g)/node-gyp/bin/node-gyp.js" >>"$GITHUB_ENV"
      - name: Cache electron-builder
        uses: actions/cache@v5
        with:
          path: |
            ~/.cache/electron
            ~/.cache/electron-builder
          key: electron-builder-linux-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: electron-builder-linux-
      - name: Install
        uses: nick-fields/retry@v4
        with:
          timeout_minutes: 15
          max_attempts: 3
          retry_wait_seconds: 30
          command: pnpm install --frozen-lockfile
      # `build:release` bundle l'app web mobile depuis v1.4.210 ; mobile/ est un projet pnpm à part.
      - uses: ./.github/actions/install-mobile-dependencies
      # `build:release` vérifie le provider computer-use Linux en important les
      # bindings AT-SPI, absents des runners Ubuntu par défaut.
      - name: Dépendances du provider computer-use Linux
        run: sudo apt-get update && sudo apt-get install -y python3-gi gir1.2-atspi-2.0 at-spi2-core xclip xdotool
      - name: Build
        run: pnpm build:release
      - name: Config electron-builder du canal fork
        run: |
          cat >config/electron-builder.fork.config.cjs <<'EOF'
          // Généré par fork-nightly.yml, jamais commité. Voir README de fork-pipeline.
          const { writeFileSync } = require('node:fs')
          const { join } = require('node:path')
          const base = require('./electron-builder.config.cjs')
          module.exports = {
            ...base,
            // publish: null => aucun app-update.yml dans le paquet.
            publish: null,
            // `afterPack` d'upstream ne stampe la provenance que sur darwin.
            // On garde le sien INTACT (glibc floor, prune, vérifs) et on
            // ajoute le seul fichier qui manquait, pour que le .deb dise de
            // quelle source il vient et qu'une étape puisse le contredire.
            afterPack: async (context) => {
              await base.afterPack(context)
              if (context.electronPlatformName !== 'linux') return
              const archByEnum = { 1: 'x64', 3: 'arm64' }
              writeFileSync(
                join(context.appOutDir, 'resources', 'orca-fork-build.json'),
                `${JSON.stringify(
                  {
                    formatVersion: 1,
                    commit: process.env.ORCA_BUILD_COMMIT || '',
                    version: context.packager.appInfo.version,
                    architecture: archByEnum[context.arch] || String(context.arch)
                  },
                  null,
                  2
                )}\n`,
                'utf8'
              )
            }
          }
          EOF
          cat config/electron-builder.fork.config.cjs
      - name: Package (.deb amd64)
        run: |
          node config/scripts/ensure-native-runtime.mjs --runtime=electron
          pnpm exec electron-builder --config config/electron-builder.fork.config.cjs --linux deb --x64 --publish never
      - name: Aucun app-update.yml dans l'artefact
        run: |
          set -euo pipefail
          deb="$(ls dist/*.deb)"
          # Liste en variable : `… | grep -q` sous pipefail rend le SIGPIPE du
          # producteur sur une correspondance, donc « présent » passait vert.
          entries="$(dpkg-deb -c "$deb")"
          case "$entries" in *app-update.yml*)
            echo "::error::app-update.yml présent dans $deb"
            exit 1 ;;
          esac
          echo "OK: pas d'app-update.yml. $(du -h "$deb")"
      - name: L'artefact dit de quelle source il vient
        env:
          EXPECTED_SHA: ${{ needs.source.outputs.sha }}
        run: |
          set -euo pipefail
          # L'inscription dans l'artefact et l'attendu viennent du même output
          # de job : on prouve aussi que l'arbre buildé EST ce commit.
          [ "$(git rev-parse HEAD)" = "$EXPECTED_SHA" ] || { echo "::error::le checkout n'est pas $EXPECTED_SHA"; exit 1; }
          deb="$(ls dist/*.deb)"
          dpkg-deb --fsys-tarfile "$deb" >"$RUNNER_TEMP/fsys.tar"
          # `awk` et non `grep | head` : sous `set -euo pipefail`, un manifeste
          # absent sortirait sur le code de grep AVANT le diagnostic.
          entry="$(tar -tf "$RUNNER_TEMP/fsys.tar" | awk '/resources\/orca-fork-build\.json$/ && !found { print; found=1 }')"
          if [ -z "$entry" ]; then
            echo "::error::orca-fork-build.json absent de $deb — le paquet ne dit pas de quelle source il vient"
            exit 1
          fi
          commit="$(tar -xOf "$RUNNER_TEMP/fsys.tar" "$entry" | node -e 'let s="";process.stdin.on("data",c=>s+=c).on("end",()=>console.log(JSON.parse(s).commit??""))')"
          if [ "$commit" != "$EXPECTED_SHA" ]; then
            {
              echo "### Provenance de l'artefact Linux incorrecte"
              echo
              echo "- attendu (source buildée, taggée) : \`$EXPECTED_SHA\`"
              echo "- inscrit dans \`$entry\` : \`$commit\`"
              echo
              echo "\`ORCA_BUILD_COMMIT\` n'a pas atteint l'\`afterPack\` de la config"
              echo "dérivée du canal."
            } >>"$GITHUB_STEP_SUMMARY"
            echo "::error::provenance linux : le paquet annonce « $commit » au lieu de $EXPECTED_SHA"
            exit 1
          fi
          echo "OK: le paquet s'annonce buildé depuis $commit."
      - uses: actions/upload-artifact@v7
        with:
          name: linux-amd64
          path: dist/*.deb
          if-no-files-found: error
          retention-days: 7

  # ---------------------------------------------------------------------------
  # 4. Publier : d'abord faire avancer les refs publiés en FAST-FORWARD, puis
  #    la release taggée avec un sha256 par artefact.
  #
  # L'ORDRE COMPTE. Les refs d'abord : si une lignée concurrente a avancé
  # pendant ces 90 minutes, l'avance est refusée par le serveur (force=false)
  # et ce job échoue AVANT de créer la release — « une avance conflictuelle ne
  # publie rien ». L'inverse publierait une release dont le canal ne pourrait
  # plus prouver l'ascendance.
  # ---------------------------------------------------------------------------
  # 4. Publier, dans cet ordre : la release en BROUILLON avec ses artefacts
  #    (invisible à l'installeur, qui exclut les brouillons), puis l'avance des
  #    refs en FAST-FORWARD seul, puis la publication. Une avance refusée ne
  #    publie rien, et un ref avancé sans release visible est retenté la nuit
  #    suivante (la fraîcheur exige une release publiée, pas le pointeur).
  # ---------------------------------------------------------------------------
  release:
    needs: [source, test, build-mac, build-linux]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v7
        with:
          path: assets
          merge-multiple: true

      - name: Préparer la release (brouillon)
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.source.outputs.tag }}
          SHA: ${{ needs.source.outputs.sha }}
          VERSION: ${{ needs.source.outputs.version }}
          MODE: ${{ needs.source.outputs.mode }}
          SOURCE_REF: ${{ needs.source.outputs.source_ref }}
          BASE_KIND: ${{ needs.source.outputs.base_kind }}
          UPSTREAM_TAG: ${{ needs.source.outputs.upstream_tag }}
          UPSTREAM_SHA: ${{ needs.source.outputs.upstream_sha }}
          PREVIOUS_SHA: ${{ needs.source.outputs.previous_sha }}
          PREVIOUS_ORIGIN: ${{ needs.source.outputs.previous_origin }}
        run: |
          set -euo pipefail
          cd assets
          ls -la
          # Un fichier de sommes, une somme par plateforme. Jamais une somme
          # unique pour deux artefacts : ce sont deux binaires différents.
          sha256sum ./* | sed 's| \./| |' >SHA256SUMS
          cat SHA256SUMS
          mac_sha="$(awk '/orca-macos-arm64\.zip$/{print $1}' SHA256SUMS)"
          deb_name="$(awk '/\.deb$/{print $2}' SHA256SUMS)"
          deb_sha="$(awk '/\.deb$/{print $1}' SHA256SUMS)"
          test -n "$mac_sha" && test -n "$deb_sha"

          # Hors du répertoire d'assets : tout ce qui traîne dedans finirait
          # attaché à la release. Les heredocs sont à la colonne 0 du script
          # une fois le bloc YAML dépouillé : un terminateur décalé ne fermerait
          # plus rien.
          if [ "$MODE" = "manual" ]; then
          cat >"$RUNNER_TEMP/notes.md" <<EOF
          Build **manuel** du canal fork : le ref \`$SOURCE_REF\` de ce dépôt,
          buildé tel quel. Les gardes d'ascendance se sont appliquées quand même.

          - source : \`$SOURCE_REF\` figé sur \`$SHA\`
          EOF
          else
          cat >"$RUNNER_TEMP/notes.md" <<EOF
          Build automatique du canal fork : la dernière release stable d'upstream
          **mergée** dans la branche d'intégration du fork — ascendance préservée,
          aucun rebase, aucun force-push.

          - base : \`$BASE_KIND\`
          EOF
          fi
          cat >>"$RUNNER_TEMP/notes.md" <<EOF
          - release stable upstream contenue : \`$UPSTREAM_TAG\` (\`$UPSTREAM_SHA\`)
          - build publié précédent, contenu : \`${PREVIOUS_SHA:-aucun}\` (\`$PREVIOUS_ORIGIN\`)
          - personnalisations : fork complet, gates perso exécutés
          - résultat : \`$SHA\` (\`fork-channel\` avancé en fast-forward sur ce commit)
          - version electron-builder : \`$VERSION\`
          - source-commit: \`$SHA\`

          | artefact | sha256 |
          | --- | --- |
          | \`orca-macos-arm64.zip\` | \`$mac_sha\` |
          | \`$deb_name\` | \`$deb_sha\` |

          **Le zip macOS n'est pas signé.** Ne l'installe pas à la main :
          \`~/orca-fork/update.sh\` purge la quarantine et le re-signe avec le
          certificat local \`Orca Dev\` auquel les grants TCC sont épinglés.
          Un bundle installé sans cette étape perd tous ses accès fichiers.

          Le VPS consomme le \`.deb\` via \`sync-toolchain.ts --apply\`, qui
          vérifie le sha256 épinglé dans \`agent/versions.yml\`.
          EOF

          # Relance d'un run : un BROUILLON du même tag est repris, jamais
          # dupliqué ; une release déjà publiée fait échouer `create`, à raison.
          if [ "$(gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json isDraft --jq .isDraft 2>/dev/null)" = "true" ]; then
            gh release delete "$TAG" --repo "$GITHUB_REPOSITORY" --yes
          fi
          gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --draft \
            --title "$TAG" --notes-file "$RUNNER_TEMP/notes.md" \
            "orca-macos-arm64.zip" "$deb_name" SHA256SUMS
          # Les trois artefacts doivent être là avant qu'un ref bouge.
          count="$(gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json assets --jq '.assets | length')"
          [ "$count" -eq 3 ] || { echo "::error::brouillon $TAG : $count artefact(s) au lieu de 3"; exit 1; }

      - name: Avancer les refs publiés (fast-forward seul)
        env:
          # Le PAT, pas GITHUB_TOKEN : l'arbre poussé contient les workflows
          # d'upstream, et GITHUB_TOKEN n'a pas le scope `workflow`. Le commit
          # existe déjà dans le dépôt (le tag le pointe), donc aucun objet n'est
          # transféré : ce sont deux mises à jour de ref, côté serveur.
          GH_TOKEN: ${{ secrets.FORK_PUSH_TOKEN }}
          SHA: ${{ needs.source.outputs.sha }}
          ADVANCE_SOURCE: ${{ needs.source.outputs.advance_source_branch }}
          BASE_KIND: ${{ needs.source.outputs.base_kind }}
        run: |
          set -euo pipefail
          # `force=false` = le serveur n'accepte QUE le fast-forward. C'est la
          # même garantie qu'un `git push` sans `--force`, sans clone ni objet
          # à transférer. Aucun chemin de ce workflow ne peut force-pusher.
          advance() {
            branch="$1"
            if current="$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/$branch" --jq .object.sha 2>/dev/null)"; then
              if [ "$current" = "$SHA" ]; then
                echo "$branch pointe déjà $SHA."
                return 0
              fi
              if ! gh api --method PATCH "repos/$GITHUB_REPOSITORY/git/refs/heads/$branch" \
                -F force=false -f "sha=$SHA" --silent; then
                {
                  echo "### Avance refusée — \`$branch\` a bougé pendant le run"
                  echo
                  echo "\`$branch\` est sur \`$current\`, et \`$SHA\` n'en est pas un"
                  echo "descendant. L'avance n'est jamais forcée : **rien n'a été publié**"
                  echo "(la release reste un brouillon, retiré par le job cleanup). Réconcilie"
                  echo "les deux lignées par un merge explicite, puis relance."
                  echo
                  echo '```bash'
                  echo "git fetch origin $branch"
                  echo "git switch -c reconcile/$branch origin/$branch"
                  echo "git merge $SHA && git push origin HEAD:$branch"
                  echo '```'
                } >>"$GITHUB_STEP_SUMMARY"
                echo "::error::avance de $branch refusée (non fast-forward depuis $current) — aucune release publiée"
                exit 1
              fi
              echo "$branch avancé de $current à $SHA."
            else
              gh api --method POST "repos/$GITHUB_REPOSITORY/git/refs" \
                -f "ref=refs/heads/$branch" -f "sha=$SHA" --silent
              echo "$branch créé sur $SHA."
            fi
          }
          # La branche d'intégration d'abord (jamais sur le chemin manuel, ni
          # sur le repli `channel`) : si son avance est refusée, le pointeur de
          # canal n'a pas bougé et « rien n'a été publié » reste vrai.
          if [ "$ADVANCE_SOURCE" = "true" ]; then
            advance "$SOURCE_BRANCH"
          else
            echo "$SOURCE_BRANCH non touchée (source = $BASE_KIND)."
          fi
          # Le pointeur du canal : c'est lui que la prochaine nuit lira comme
          # « dernier build publié », et ce fast-forward est ce qui rend
          # impossible une régression d'ascendance.
          advance "$CHANNEL_BRANCH"

      - name: Publier la release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.source.outputs.tag }}
        run: |
          set -euo pipefail
          gh release edit "$TAG" --repo "$GITHUB_REPOSITORY" --draft=false
          echo "Release $TAG publiée." >>"$GITHUB_STEP_SUMMARY"
          gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json url --jq .url >>"$GITHUB_STEP_SUMMARY"

  # ---------------------------------------------------------------------------
  # 5. Un run rouge ne laisse pas de tag orphelin ni de brouillon : le tag ne
  #    gardait vivant le commit de merge que pour ce run, et une release
  #    brouillon inachevée ne doit pas être reprise par erreur.
  # ---------------------------------------------------------------------------
  cleanup:
    needs: [source, test, build-mac, build-linux, release]
    if: (failure() || cancelled()) && needs.source.outputs.tag != '' && needs.release.result != 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Retirer le tag et le brouillon du run
        env:
          GH_TOKEN: ${{ secrets.FORK_PUSH_TOKEN }}
          TAG: ${{ needs.source.outputs.tag }}
        run: |
          set -euo pipefail
          if [ -z "${GH_TOKEN:-}" ]; then echo "::warning::FORK_PUSH_TOKEN absent — tag $TAG laissé en place"; exit 0; fi
          if [ "$(gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json isDraft --jq .isDraft 2>/dev/null)" = "true" ]; then
            gh release delete "$TAG" --repo "$GITHUB_REPOSITORY" --yes
            echo "Brouillon $TAG supprimé."
          fi
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Release $TAG publiée : tag conservé."
            exit 0
          fi
          gh api --method DELETE "repos/$GITHUB_REPOSITORY/git/refs/tags/$TAG" --silent && echo "Tag $TAG supprimé."

  # ---------------------------------------------------------------------------
  # 6. L'alerte. Elle ne rattrape rien : elle dit qu'une main humaine est
  #    nécessaire, le jour où l'intégration ou le build cède — ou qu'un run a
  #    été annulé, ce qui est une nuit silencieuse au même titre.
  # ---------------------------------------------------------------------------
  alert:
    needs: [source, test, build-mac, build-linux, release]
    if: failure() || cancelled()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Telegram
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          SOURCE: ${{ needs.source.result }}
          TESTS: ${{ needs.test.result }}
          MAC: ${{ needs.build-mac.result }}
          LINUX: ${{ needs.build-linux.result }}
          RELEASE: ${{ needs.release.result }}
        run: |
          set -euo pipefail
          text="Orca fork nightly ÉCHEC
          source=$SOURCE tests=$TESTS mac=$MAC linux=$LINUX release=$RELEASE
          $RUN_URL"
          if [ "$SOURCE" = "failure" ]; then
            text="$text
          Source refusée ou conflit d'intégration : le résumé du run liste les fichiers et la commande."
          fi
          if [ "$RELEASE" = "failure" ]; then
            text="$text
          Publication refusée (avance non fast-forward ?) : rien n'a été publié, brouillon retiré."
          fi
          # Un canal d'alerte non branché ne vaut pas mieux que pas d'alerte : il
          # vaut moins, parce qu'il donne l'illusion d'une surveillance. On le dit
          # fort et on n'invente pas de destinataire par défaut. Le run reste
          # rouge de toute façon — c'est le job échoué qui porte le verdict.
          if [ -z "${TELEGRAM_BOT_TOKEN:-}" ] || [ -z "${TELEGRAM_CHAT_ID:-}" ]; then
            {
              echo "### Alerte Telegram NON envoyée — secret manquant"
              echo
              echo '```bash'
              echo "gh secret set TELEGRAM_BOT_TOKEN --repo $GITHUB_REPOSITORY"
              echo "gh secret set TELEGRAM_CHAT_ID  --repo $GITHUB_REPOSITORY"
              echo '```'
              echo
              echo "Message qui aurait été envoyé :"
              echo '```'
              echo "$text"
              echo '```'
            } >>"$GITHUB_STEP_SUMMARY"
            echo "::warning::TELEGRAM_BOT_TOKEN / TELEGRAM_CHAT_ID absents — alerte non envoyée"
            exit 0
          fi
          curl -fsS -o /dev/null \
            "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
            --data-urlencode "chat_id=${TELEGRAM_CHAT_ID}" \
            --data-urlencode "text=${text}"
          echo "Alerte Telegram envoyée." >>"$GITHUB_STEP_SUMMARY"
