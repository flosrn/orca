name: fork nightly

# Le canal fork d'Orca, entretenu tout seul. Lis README.md sur cette branche
# d'abord : il explique pourquoi la branche par défaut ne contient pas de code,
# quelle branche la CI possède, et par où on sort de ce dispositif.
#
# Ce fichier ne vit QUE sur `fork-pipeline`. `schedule` ne se déclenche que
# depuis la branche par défaut du dépôt, et la branche patch est gelée.

on:
  schedule:
    # 04:30 UTC = 06:30 Paris l'été, 05:30 l'hiver. Un seul cron, pas de jumeau
    # DST : ce qui compte est « avant que Flo ouvre la machine », pas l'heure
    # exacte. Minute 30 pour ne pas se coller à la vague de crons de minute 0.
    - cron: '30 4 * * *'
  workflow_dispatch:
    inputs:
      force:
        description: Builder même si ni upstream ni le patch n'ont bougé
        type: boolean
        default: false
      source_ref:
        description: >-
          Builder CE ref de CE dépôt tel quel (branche, tag ou sha) : aucun
          rebase, aucun push de la branche patch. Vide = nightly.
        type: string
        default: ''

# Lecture par défaut ; les deux jobs qui écrivent (push de `fork-channel`,
# création de la release) demandent `contents: write` pour eux seuls.
permissions:
  contents: read

# Pas de cancel-in-progress : un run annulé au milieu laisse un tag sans
# artefacts, et deux runs concurrents se disputeraient le force-push.
concurrency:
  group: fork-nightly
  cancel-in-progress: false

env:
  # La branche patch. Par défaut `feat/argv-worker-start`, la branche de la PR
  # upstream #16425 : elle ne reçoit QUE la plage du patch, jamais une
  # personnalisation — et une garde le vérifie commit par commit.
  #
  # CONTRAT DE PAIRE : `PATCH_BRANCH` et `CUSTOM_BRANCH` doivent partager LA
  # MÊME BASE amont. Le sélecteur de customs est `patch...custom` par patch-id :
  # avancer `CUSTOM_BRANCH` sur un portage vers une base plus récente en
  # laissant `PATCH_BRANCH` sur l'ancienne ferait entrer la churn amont de la
  # nouvelle base dans la sélection, et rejouerait le patch en double. Les deux
  # variables bougent donc ENSEMBLE, et une `PATCH_BRANCH` réglée sur une
  # branche propre au fork a l'effet voulu de plus : la nuit n'écrit alors plus
  # jamais la branche de la PR upstream.
  PATCH_BRANCH: ${{ vars.PATCH_BRANCH || 'feat/argv-worker-start' }}
  # Branche perso, empilée sur le patch. C'est elle que le canal build.
  # Vide = canal nu (patch seul). Réglable SANS commit :
  # Settings > Secrets and variables > Actions > Variables > CUSTOM_BRANCH.
  CUSTOM_BRANCH: ${{ vars.CUSTOM_BRANCH }}
  CHANNEL_BRANCH: fork-channel
  UPSTREAM_URL: https://github.com/stablyai/orca.git
  # Le Mac a mesuré que Node 22 casse le packaging de node-pty et que 24.11.1
  # passe. `engines.node` du dépôt dit « 24 », ce qui flotterait sur la dernière
  # 24.x : on épingle la version exacte que ce canal a exercée.
  NODE_VERSION: 24.11.1

jobs:
  # ---------------------------------------------------------------------------
  # 1. Rejouer le patch sur upstream du jour. Le seul job qui écrit une branche.
  # ---------------------------------------------------------------------------
  rebase:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: read
    outputs:
      # Un run n'emprunte QU'UN des deux chemins, et les sorties d'une étape
      # sautée sont vides : `||` choisit donc le chemin qui a tourné, sans
      # qu'aucun job d'aval ait à savoir lequel c'était.
      should_build: ${{ steps.manual.outputs.should_build || steps.plan.outputs.should_build }}
      sha: ${{ steps.manual.outputs.sha || steps.rebase.outputs.sha }}
      tag: ${{ steps.manual_tag.outputs.tag || steps.rebase.outputs.tag }}
      version: ${{ steps.manual.outputs.version || steps.rebase.outputs.version }}
      identity: ${{ steps.manual.outputs.identity || steps.plan.outputs.identity }}
      upstream_sha: ${{ steps.plan.outputs.upstream_sha }}
      patch_sha: ${{ steps.plan.outputs.patch_sha }}
      custom_sha: ${{ steps.plan.outputs.custom_sha }}
      # `incorporated` = la source buildée porte les commits de CUSTOM_BRANCH ;
      # `bare` = canal nu assumé (aucune CUSTOM_BRANCH, ou branche sans commit
      # propre). L'aval s'en sert pour exiger les gates perso : un `bare` qui
      # serait en fait une source amputée ne sort pas d'ici — la garde de
      # composition échoue avant, sur le chemin manuel comme la nuit.
      custom_state: ${{ steps.guard.outputs.custom_state || steps.plan.outputs.custom_state }}
      mode: ${{ steps.manual.outputs.active == 'true' && 'manual' || 'nightly' }}
      source_ref: ${{ steps.manual.outputs.source_ref }}
    steps:
      # ---------------------------------------------------------------------
      # Chemin manuel : builder un ref de CE dépôt TEL QUEL.
      #
      # Pourquoi il existe. La nightly FABRIQUE sa source — elle rejoue le
      # patch sur upstream, empile les customs, et force-push `PATCH_BRANCH`,
      # qui par défaut est la branche de la PR upstream #16425. Quand la source
      # voulue est déjà intégrée dans une branche perso, ce travail n'est pas
      # seulement inutile : il est interdit tant que `PATCH_BRANCH` est cette
      # branche, parce qu'il la republierait pour livrer quelque chose qui n'a
      # rien à y faire.
      #
      # Ce chemin ne rejoue rien et ne pousse AUCUNE branche. Il fige le ref
      # demandé en un sha exact, une seule fois, et pose un tag immuable sur
      # CE sha. Tout l'aval (tests, mac, linux, release) consomme le tag et
      # jamais le ref : si la branche bouge pendant le run, le build ne bouge
      # pas. Les gates sont les mêmes — un build manuel n'achète aucune
      # dispense.
      - name: Chemin manuel - figer le ref source demandé
        id: manual
        if: github.event_name == 'workflow_dispatch' && inputs.source_ref != ''
        env:
          # Le tag pointe sur un commit DÉJÀ dans ce dépôt, donc aucun objet
          # n'est poussé — mais ce job est `contents: read` et ne peut pas
          # créer de ref avec GITHUB_TOKEN. On réutilise le PAT de la nightly,
          # passé par l'environnement : il n'apparaît dans aucune commande.
          GH_TOKEN: ${{ secrets.FORK_PUSH_TOKEN }}
          SOURCE_REF: ${{ inputs.source_ref }}
        run: |
          set -euo pipefail
          if [ -z "${GH_TOKEN:-}" ]; then
            {
              echo "### Secret manquant — impossible de poser le tag de build"
              echo
              echo '```bash'
              echo "gh secret set FORK_PUSH_TOKEN --repo $GITHUB_REPOSITORY"
              echo '```'
            } >>"$GITHUB_STEP_SUMMARY"
            echo "::error::FORK_PUSH_TOKEN absent — gh secret set FORK_PUSH_TOKEN --repo $GITHUB_REPOSITORY"
            exit 1
          fi

          # Validation bornée : un NOM de ref simple, et rien d'autre. L'API
          # interrogée plus bas ne connaît que $GITHUB_REPOSITORY — elle ne
          # peut pas aller chercher upstream — et cette garde ferme le reste :
          # pas d'URL, pas de `owner/repo:ref`, pas de révision calculée
          # (`~`, `^`, `..`) dont le résultat dépendrait du moment de lecture.
          if ! printf '%s' "$SOURCE_REF" | grep -Eq '^[A-Za-z0-9][A-Za-z0-9._/-]{0,199}$'; then
            echo "::error::source_ref refusé : « $SOURCE_REF » n'est pas un nom de ref simple de ce dépôt"
            exit 1
          fi
          if printf '%s' "$SOURCE_REF" | grep -q '\.\.'; then
            echo "::error::source_ref refusé : « $SOURCE_REF » contient '..'"
            exit 1
          fi

          # UNE seule résolution, dans CE dépôt. `commits/{ref}` accepte une
          # branche, un tag ou un sha et rend le sha exact. Après cette ligne
          # personne ne relit le ref : c'est ce qui tue la course « la branche
          # avance pendant que le build tourne ».
          sha="$(gh api "repos/$GITHUB_REPOSITORY/commits/$SOURCE_REF" --jq .sha)"
          # Un sha complet, exactement 40 hexa, et rien d'autre. Un préfixe
          # suivi de n'importe quoi laisserait passer une réponse tronquée ou
          # un `null` mis en forme, et ce sha part ensuite dans un tag et dans
          # le checkout de tous les jobs d'aval.
          if ! printf '%s' "$sha" | grep -Eq '^[0-9a-f]{40}$'; then
            echo "::error::« $SOURCE_REF » ne résout pas en commit de $GITHUB_REPOSITORY (reçu : « $sha »)"
            exit 1
          fi
          echo "source_ref « $SOURCE_REF » figé sur $sha"

          # La version est lue à CE sha, pas sur une branche : c'est elle que
          # electron-builder inscrira dans l'artefact.
          version="$(gh api "repos/$GITHUB_REPOSITORY/contents/package.json?ref=$sha" \
            -H 'Accept: application/vnd.github.raw' --jq .version)"
          # `--jq` sur un champ absent imprime la CHAÎNE `null` : un simple
          # `test -n` la prendrait pour une version valide et on taggerait une
          # release nommée d'après un trou.
          if [ -z "$version" ] || [ "$version" = "null" ]; then
            echo "::error::package.json de $sha n'a pas de version lisible"
            exit 1
          fi

          # Le tag N'EST PAS posé ici. Il l'est après la garde de composition,
          # une étape plus bas : tout l'aval consomme le tag, donc le poser
          # avant la garde publierait un ref immuable pour une source qu'on
          # s'apprête à refuser.
          {
            echo "active=true"
            echo "should_build=true"
            echo "sha=$sha"
            echo "version=$version"
            echo "source_ref=$SOURCE_REF"
          } >>"$GITHUB_OUTPUT"

          # `manual-` n'est pas hexadécimal, et la garde de fraîcheur de la
          # nightly ne lit une identité que dans `[0-9a-f+]` : elle ne
          # reconnaîtra pas celle-ci et rebuildera la nuit suivante. C'est le
          # bon sens de l'erreur — un run manuel ne doit JAMAIS faire sauter
          # une nightly. Le coût est un build nocturne de plus, une fois.
          echo "identity=manual-${sha:0:12}" >>"$GITHUB_OUTPUT"

      # Le chemin manuel prend la source TELLE QUELLE. C'est sa raison d'être,
      # et c'est aussi ce qui a publié une fois un binaire ne contenant que le
      # patch `argv-worker-start` : la source demandée n'embarquait aucune des
      # personnalisations (les compteurs de quota, entre autres), et rien dans
      # le run ne l'a dit. `CUSTOM_BRANCH` était réglée, le canal l'a ignorée
      # en silence. Cette garde ferme ça, et rien d'autre : elle ne rejoue
      # aucun commit, ne pousse aucune branche, et ne touche pas la sémantique
      # « ce sha, tel quel » — elle refuse juste de tagger une source amputée.
      - name: Chemin manuel - checkout de la source figée
        uses: actions/checkout@v6
        if: steps.manual.outputs.active == 'true'
        with:
          path: src
          # Le SHA figé, jamais le ref : la garde vérifie CE QUI SERA BUILDÉ.
          ref: ${{ steps.manual.outputs.sha }}
          # La garde compare des patch-ids de part et d'autre d'une merge-base :
          # un historique tronqué la rate.
          fetch-depth: 0
          persist-credentials: false

      - name: Chemin manuel - garde de composition
        id: guard
        if: steps.manual.outputs.active == 'true'
        working-directory: src
        env:
          # Lecture seule : un fetch de deux branches de CE dépôt.
          GH_TOKEN: ${{ github.token }}
          BUILD_SHA: ${{ steps.manual.outputs.sha }}
          SOURCE_REF: ${{ steps.manual.outputs.source_ref }}
        run: |
          set -euo pipefail
          if [ -z "${CUSTOM_BRANCH:-}" ]; then
            # Canal nu assumé : il n'y a aucune personnalisation à exiger.
            echo "custom_state=bare" >>"$GITHUB_OUTPUT"
            echo "Aucune CUSTOM_BRANCH réglée — canal nu, rien à vérifier."
            exit 0
          fi
          if [ "$CUSTOM_BRANCH" = "$PATCH_BRANCH" ]; then
            echo "::error::CUSTOM_BRANCH == PATCH_BRANCH : réglage invalide"
            exit 1
          fi

          remote="https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git fetch --no-tags --quiet "$remote" \
            "+refs/heads/$PATCH_BRANCH:refs/guard/patch" \
            "+refs/heads/$CUSTOM_BRANCH:refs/guard/custom"
          patch_head="$(git rev-parse refs/guard/patch)"
          custom_sha="$(git rev-parse refs/guard/custom)"

          # MÊME sélection que la nightly : les commits propres à la branche
          # perso, par patch-id (`--cherry-pick --right-only`), pas par ancêtre
          # commun. Ta branche peut être basée sur un patch périmé ; les commits
          # du patch qu'elle porte encore sont reconnus et écartés.
          mapfile -t custom_commits < <(
            git rev-list --reverse --no-merges --cherry-pick --right-only \
              "$patch_head...$custom_sha"
          )
          if [ "${#custom_commits[@]}" -eq 0 ]; then
            # Une branche perso encore vide n'est pas une erreur — même
            # tolérance que la nightly.
            echo "custom_state=bare" >>"$GITHUB_OUTPUT"
            echo "$CUSTOM_BRANCH n'a aucun commit propre — canal nu."
            exit 0
          fi

          # UN seul signal : le PATCH-ID. `git cherry <source> <perso> <patch>`
          # marque `-` un commit dont un équivalent par patch-id est déjà dans
          # la source, `+` un commit absent. C'est ce qui rend la garde
          # indifférente au chemin — rebase, cherry-pick, branche
          # d'intégration : le sha change, le patch-id non. Une ascendance de
          # sha (`merge-base`, `--contains`) refuserait au contraire toute
          # source rebasée, c'est-à-dire le cas normal.
          #
          # Et rien d'autre. Reconnaître un commit au SUJET, ou à n'importe
          # quel signal approchant, rouvrirait exactement le contournement
          # silencieux qu'on ferme ici : deux commits peuvent porter le même
          # sujet et n'avoir aucun contenu en commun. La garde refuse par
          # défaut, et le refus est actionnable.
          #
          # Conséquence à connaître : un commit perso RÉADAPTÉ pour une base
          # majeure (conflit résolu à la main, API amont renommée) a un
          # patch-id différent, et la garde le déclare absent — correctement,
          # parce qu'elle ne peut pas savoir que le portage est fidèle. Le
          # réglage n'est pas de relâcher la garde : c'est de faire pointer
          # `CUSTOM_BRANCH` sur la branche qui porte VRAIMENT tes
          # personnalisations pour cette base. Une `CUSTOM_BRANCH` restée sur
          # l'état d'avant le portage est la dérive à corriger, pas un faux
          # positif de la garde.
          selected=" ${custom_commits[*]} "
          missing=()
          while read -r mark commit; do
            case "$selected" in
              *" $commit "*) ;;
              *) continue ;;
            esac
            if [ "$mark" = "+" ]; then
              missing+=("$commit")
            fi
          done < <(git cherry "$BUILD_SHA" "$custom_sha" "$patch_head")

          if [ "${#missing[@]}" -gt 0 ]; then
            {
              echo "### Source refusée — ${#missing[@]} personnalisation(s) absente(s)"
              echo
              echo "\`source_ref\` = \`$SOURCE_REF\` (\`$BUILD_SHA\`) ne contient pas"
              echo "tout \`$CUSTOM_BRANCH\` (\`${custom_sha:0:12}\`, ${#custom_commits[@]} commit(s) propre(s))."
              echo "Publier ça livrerait un binaire sans ces changements — c'est"
              echo "exactement la panne que cette garde existe pour empêcher."
              echo
              echo "Absents (aucun équivalent par patch-id dans la source) :"
              echo '```'
              for commit in "${missing[@]}"; do
                git log -1 --format='%H %s' "$commit"
              done
              echo '```'
              echo
              echo "Trois sorties, selon ce qui est vrai :"
              echo
              echo '```bash'
              echo "# 1. la source devait contenir tes customs : build la branche qui les porte"
              echo "gh workflow run fork-nightly.yml --repo $GITHUB_REPOSITORY --ref fork-pipeline \\"
              echo "  -f source_ref=\$(git rev-parse $CUSTOM_BRANCH)"
              echo
              echo "# 2. tes customs ont été RÉADAPTÉES sur une base majeure (patch-id différent) :"
              echo "#    fais pointer CUSTOM_BRANCH sur la branche qui les porte pour cette base,"
              echo "#    puis relance — la garde compare alors la source à ce qu'elle contient."
              echo "gh variable set CUSTOM_BRANCH --repo $GITHUB_REPOSITORY --body <branche-portée>"
              echo
              echo "# 3. ou laisser la nightly fabriquer la source (elle empile $CUSTOM_BRANCH) :"
              echo "gh workflow run fork-nightly.yml --repo $GITHUB_REPOSITORY --ref fork-pipeline -f force=true"
              echo '```'
              echo
              echo "Assumer un canal nu se règle explicitement, pas par omission :"
              echo "\`gh variable delete CUSTOM_BRANCH --repo $GITHUB_REPOSITORY\`."
            } >>"$GITHUB_STEP_SUMMARY"
            echo "::error::source refusée : ${#missing[@]}/${#custom_commits[@]} commit(s) de $CUSTOM_BRANCH absent(s) de $SOURCE_REF — aucun tag posé"
            exit 1
          fi

          echo "custom_state=incorporated" >>"$GITHUB_OUTPUT"
          echo "Composition OK : ${#custom_commits[@]} commit(s) de $CUSTOM_BRANCH présent(s) dans $BUILD_SHA."
          {
            echo "### Composition vérifiée"
            echo
            echo "- source : \`$SOURCE_REF\` (\`${BUILD_SHA:0:12}\`)"
            echo "- \`$CUSTOM_BRANCH\` : \`${custom_sha:0:12}\`, ${#custom_commits[@]} commit(s) propre(s), tous présents par patch-id"
          } >>"$GITHUB_STEP_SUMMARY"

      - name: Chemin manuel - poser le tag de build
        id: manual_tag
        if: steps.manual.outputs.active == 'true'
        env:
          # Le tag pointe sur un commit DÉJÀ dans ce dépôt, donc aucun objet
          # n'est poussé — mais ce job est `contents: read` et ne peut pas
          # créer de ref avec GITHUB_TOKEN. On réutilise le PAT de la nightly,
          # passé par l'environnement : il n'apparaît dans aucune commande.
          GH_TOKEN: ${{ secrets.FORK_PUSH_TOKEN }}
          SHA: ${{ steps.manual.outputs.sha }}
          VERSION: ${{ steps.manual.outputs.version }}
          SOURCE_REF: ${{ steps.manual.outputs.source_ref }}
          CUSTOM_STATE: ${{ steps.guard.outputs.custom_state }}
        run: |
          set -euo pipefail
          sha="$SHA"
          # Même forme de tag que la nightly : update.sh et versions.yml n'ont
          # qu'un `kind` à connaître, et surtout pas deux conventions.
          tag="fork-$(date -u +%Y%m%d-%H%M)-${sha:0:12}"
          if existing="$(gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$tag" --jq .object.sha 2>/dev/null)"; then
            # Idempotent si c'est le MÊME sha (relance d'un run) ; sinon on
            # refuse d'écraser un tag que des artefacts référencent peut-être.
            if [ "$existing" != "$sha" ]; then
              echo "::error::le tag $tag existe déjà sur $existing — attends une minute et relance"
              exit 1
            fi
            echo "Tag $tag déjà posé sur ce sha — réutilisé."
          else
            gh api --method POST "repos/$GITHUB_REPOSITORY/git/refs" \
              -f "ref=refs/tags/$tag" -f "sha=$sha" --silent
            echo "Tag $tag créé sur $sha."
          fi
          echo "tag=$tag" >>"$GITHUB_OUTPUT"
          {
            echo "### Chemin manuel — source figée"
            echo
            echo "- ref demandé : \`$SOURCE_REF\`"
            echo "- sha figé : \`$sha\`"
            echo "- tag immuable : \`$tag\`"
            echo "- version : \`$VERSION\`"
            echo "- personnalisations : \`$CUSTOM_STATE\`"
            echo
            echo "Aucun rebase, aucun push de \`$PATCH_BRANCH\`."
          } >>"$GITHUB_STEP_SUMMARY"

      - name: Checkout la branche de pilotage (cache rerere)
        uses: actions/checkout@v6
        if: steps.manual.outputs.active != 'true'
        with:
          path: pipeline
          # Ce checkout ne pousse rien ; ne pas laisser traîner son credential.
          persist-credentials: false

      - name: Checkout la branche patch
        uses: actions/checkout@v6
        if: steps.manual.outputs.active != 'true'
        with:
          path: src
          ref: ${{ env.PATCH_BRANCH }}
          # Le rebase a besoin de l'historique complet pour trouver la
          # merge-base avec upstream : une profondeur tronquée la rate.
          fetch-depth: 0
          # Sinon checkout pose un http.extraheader avec GITHUB_TOKEN, qui prime
          # sur les identifiants de l'URL de push : 403 github-actions[bot].
          persist-credentials: false

      # Décider AVANT de builder : upstream est souvent immobile la nuit, et
      # rebuilder un couple (upstream, patch) déjà publié coûte deux runners et
      # ajoute un tag qui ne dit rien de neuf.
      - name: Y a-t-il quelque chose de neuf
        id: plan
        if: steps.manual.outputs.active != 'true'
        working-directory: src
        env:
          GH_TOKEN: ${{ github.token }}
          FORCED: ${{ github.event_name == 'workflow_dispatch' && inputs.force }}
        run: |
          set -euo pipefail
          git remote add upstream "$UPSTREAM_URL"
          git fetch --no-tags --quiet upstream main
          upstream_sha="$(git rev-parse upstream/main)"
          patch_sha="$(git rev-parse HEAD)"
          # L'identité NE PEUT PAS être le sha de la branche patch : ce job la
          # rebase et la force-push, donc son sha bouge chaque nuit même quand
          # rien n'a changé, et la détection de fraîcheur rebuilderait tous les
          # jours pour rien. `patch-id --stable` digère le CONTENU du patch : il
          # ne bouge que si le patch ou son contexte bouge vraiment.
          base="$(git merge-base upstream/main HEAD)"
          patch_id="$(git diff "$base"..HEAD | git patch-id --stable | cut -d' ' -f1)"
          identity="${upstream_sha:0:12}+${patch_id:0:12}"

          # La branche perso entre dans l'identité. Sans ça, un commit de
          # personnalisation ne déclencherait AUCUN build : le couple
          # (upstream, patch) n'aurait pas bougé et la fraîcheur conclurait
          # « rien de neuf » — le canal ignorerait silencieusement ton travail.
          #
          # `--cherry-pick --right-only` sélectionne les commits propres à la
          # branche perso PAR PATCH-ID, pas par ancêtre commun. C'est ce qui
          # rend le canal indifférent à la base sur laquelle tu travailles :
          # `merge-base` remonterait trop loin dès que ta branche est basée sur
          # un patch d'avant-hier, et les commits du patch seraient rejoués en
          # double. Ici ils sont reconnus comme déjà présents et écartés.
          #
          # `--no-merges` : `cherry-pick` ne sait pas rejouer un commit de
          # merge. Garde ta branche perso linéaire (rebase, pas merge).
          custom_sha=""
          if [ -n "${CUSTOM_BRANCH:-}" ]; then
            if [ "$CUSTOM_BRANCH" = "$PATCH_BRANCH" ]; then
              echo "::error::CUSTOM_BRANCH == PATCH_BRANCH : tes commits partiraient dans la PR upstream"
              exit 1
            fi
            git fetch --no-tags --quiet origin "$CUSTOM_BRANCH"
            custom_sha="$(git rev-parse FETCH_HEAD)"
            custom_id="$(
              git rev-list --reverse --no-merges --cherry-pick --right-only \
                "$patch_sha...$custom_sha" \
                | while read -r c; do
                    git show "$c" | git patch-id --stable | cut -d' ' -f1
                  done \
                | sha256sum | cut -c1-12
            )"
            n="$(git rev-list --count --no-merges --cherry-pick --right-only "$patch_sha...$custom_sha")"
            if [ "$n" -eq 0 ]; then
              # Une branche perso encore vide n'est pas une erreur : c'est
              # l'état normal entre « je crée la branche » et « je commite ».
              # La faire échouer imposerait un ordre à respecter, donc
              # exactement la prise de tête que ce canal doit éviter.
              echo "$CUSTOM_BRANCH n'a encore aucun commit propre — canal nu ce soir."
              custom_sha=""
            else
              identity="$identity+$custom_id"
              echo "Branche perso : $CUSTOM_BRANCH @ ${custom_sha:0:12} — $n commit(s) propre(s)"
            fi
          else
            echo "Canal nu : aucune CUSTOM_BRANCH réglée."
          fi
          {
            echo "upstream_sha=$upstream_sha"
            echo "patch_sha=$patch_sha"
            echo "custom_sha=$custom_sha"
            echo "identity=$identity"
            # La nuit, la source est FABRIQUÉE : le job de rebase empile
            # littéralement ces commits, donc `custom_sha` non vide vaut preuve
            # d'incorporation. Sur le chemin manuel, la source est donnée et
            # c'est la garde de composition qui répond à la même question.
            if [ -n "$custom_sha" ]; then
              echo "custom_state=incorporated"
            else
              echo "custom_state=bare"
            fi
          } >>"$GITHUB_OUTPUT"

          if [ "$FORCED" = "true" ]; then
            echo "should_build=true" >>"$GITHUB_OUTPUT"
            echo "Dispatch forcé : on build $identity."
            exit 0
          fi

          # L'identité du couple est inscrite dans le corps de la release
          # précédente. Les drafts sont exclus : un draft n'a jamais été
          # consommé, donc le traiter comme « déjà publié » sauterait un build
          # qui n'a en réalité jamais abouti.
          last="$(gh release list --repo "$GITHUB_REPOSITORY" --limit 20 --exclude-drafts \
            --json tagName --jq '[.[] | select(.tagName | startswith("fork-"))][0].tagName // empty')"
          if [ -z "$last" ]; then
            echo "should_build=true" >>"$GITHUB_OUTPUT"
            echo "Aucune release fork antérieure : on build $identity."
            exit 0
          fi
          previous="$(gh release view "$last" --repo "$GITHUB_REPOSITORY" --json body \
            --jq '.body | capture("source-identity: `(?<id>[0-9a-f+]+)`") | .id' 2>/dev/null || true)"
          if [ "$previous" = "$identity" ]; then
            echo "should_build=false" >>"$GITHUB_OUTPUT"
            echo "$last porte déjà $identity — rien n'a bougé, on s'arrête."
          else
            echo "should_build=true" >>"$GITHUB_OUTPUT"
            echo "$last portait ${previous:-<illisible>}, maintenant $identity — on build."
          fi

      - name: Rejouer le patch, puis les personnalisations
        id: rebase
        if: steps.manual.outputs.active != 'true' && steps.plan.outputs.should_build == 'true'
        working-directory: src
        env:
          UPSTREAM_SHA: ${{ steps.plan.outputs.upstream_sha }}
          CUSTOM_SHA: ${{ steps.plan.outputs.custom_sha }}
          FORK_PUSH_TOKEN: ${{ secrets.FORK_PUSH_TOKEN }}
        run: |
          set -euo pipefail
          git config user.name 'orca fork pipeline'
          git config user.email 'fork-pipeline@users.noreply.github.com'

          # rerere rejoue une résolution qu'un HUMAIN a déjà faite sur les mêmes
          # hunks — il n'invente rien. Sans le cache, tout conflit arrête le run,
          # ce qui est le comportement voulu par défaut.
          git config rerere.enabled true
          git config rerere.autoUpdate true
          mkdir -p .git/rr-cache
          if [ -d ../pipeline/rerere-cache ] && [ -n "$(ls -A ../pipeline/rerere-cache)" ]; then
            cp -R ../pipeline/rerere-cache/. .git/rr-cache/
            echo "rerere: $(find .git/rr-cache -name postimage\* | wc -l) résolution(s) chargée(s)."
          else
            echo "rerere: aucun cache publié."
          fi

          patch_head="$(git rev-parse HEAD)"

          # Rejoue une plage sur HEAD. $1 nomme l'étage, pour que le message de
          # conflit dise À QUI est le travail : un conflit dans le patch et un
          # conflit dans tes customs ne se résolvent pas au même endroit.
          replay() {
            stage="$1"
            shift
            set +e
            git cherry-pick -x "$@"
            status=$?
            while [ $status -ne 0 ]; do
              unresolved="$(git diff --name-only --diff-filter=U)"
              if [ -n "$unresolved" ]; then
                set -e
                {
                  echo "### Conflit de rebase — étage \`$stage\` — résolution humaine requise"
                  echo
                  echo "Cet étage ne se rejoue plus tel quel sur \`upstream/main\` (\`$UPSTREAM_SHA\`)."
                  echo
                  echo "Fichiers en conflit :"
                  echo '```'
                  echo "$unresolved"
                  echo '```'
                  echo "Résous-le une fois en local et publie la résolution dans \`rerere-cache/\` :"
                  echo "les runs suivants la rejoueront seuls (mode opératoire dans le README de \`fork-pipeline\`)."
                } >>"$GITHUB_STEP_SUMMARY"
                echo "::error::conflit de rebase ($stage) sur : $(echo "$unresolved" | tr '\n' ' ')"
                exit 1
              fi
              # Rien en conflit mais rien à committer non plus : la résolution a
              # rendu ce commit vide (upstream a déjà pris ce morceau). On saute.
              if git diff --cached --quiet; then
                git cherry-pick --skip
              else
                git -c core.editor=true cherry-pick --continue
              fi
              status=$?
            done
            set -e
          }

          # --- étage 1 : le patch, et RIEN de plus ---------------------------
          # Pas de merge, pas de squash, pas d'ajout — la surface du patch est
          # gelée et cette plage est ce qui le garantit. Ce SHA, et lui seul,
          # part sur `PATCH_BRANCH`.
          base="$(git merge-base "$UPSTREAM_SHA" "$patch_head")"
          mapfile -t patch_commits < <(git rev-list --reverse "$base..$patch_head")
          echo "Base commune : $base"
          echo "Commits du patch : ${#patch_commits[@]}"
          git log --oneline --no-decorate "$base..$patch_head"
          if [ "${#patch_commits[@]}" -eq 0 ]; then
            echo "::error::la branche patch n'ajoute aucun commit à sa base — rien à rejouer"
            exit 1
          fi
          git checkout -B "$CHANNEL_BRANCH" "$UPSTREAM_SHA"
          replay patch "${patch_commits[@]}"
          patch_sha="$(git rev-parse HEAD)"

          # Garde : la branche patch ne doit JAMAIS porter autre chose que le
          # patch. Le compte est exact — un commit qui fuirait ferait dépasser.
          # Il peut être inférieur : un commit rendu vide par upstream est sauté.
          got="$(git rev-list --count "$UPSTREAM_SHA..$patch_sha")"
          if [ "$got" -gt "${#patch_commits[@]}" ]; then
            echo "::error::$got commits sur la branche PR pour ${#patch_commits[@]} attendus — fuite, on ne pousse rien"
            exit 1
          fi

          # --- étage 2 : tes personnalisations, empilées ---------------------
          # Sélection par PATCH-ID (`--cherry-pick --right-only`), pas par
          # ancêtre commun : ta branche peut être basée sur n'importe quel état
          # du patch, même vieux de plusieurs jours. Les commits du patch qu'elle
          # porte déjà sont reconnus et écartés au lieu d'être rejoués en double.
          #
          # Ta branche n'est JAMAIS réécrite par ce job. C'est la tienne : si le
          # pipeline la force-pushait, ta copie locale divergerait chaque nuit et
          # tu devrais réconcilier avant chaque commit. Le résultat du rebase ne
          # vit que dans le tag immuable de la release.
          build_sha="$patch_sha"
          if [ -n "${CUSTOM_SHA:-}" ]; then
            mapfile -t custom_commits < <(
              git rev-list --reverse --no-merges --cherry-pick --right-only \
                "$patch_head...$CUSTOM_SHA"
            )
            echo "Commits perso : ${#custom_commits[@]}"
            git log --oneline --no-decorate --no-walk "${custom_commits[@]}"
            replay perso "${custom_commits[@]}"
            build_sha="$(git rev-parse HEAD)"
          fi

          sha="$build_sha"
          version="$(node -p "require('./package.json').version")"
          tag="fork-$(date -u +%Y%m%d-%H%M)-${sha:0:12}"
          {
            echo "sha=$sha"
            echo "tag=$tag"
            echo "version=$version"
          } >>"$GITHUB_OUTPUT"
          echo "Buildé depuis $sha (version $version), tag prévu $tag."

          # GITHUB_TOKEN n'a pas le scope `workflow`, et l'arbre rejoué contient
          # les ~30 workflows d'upstream : ni la branche ni le tag ne passent
          # sans PAT. On échoue fermé.
          if [ -z "${FORK_PUSH_TOKEN:-}" ]; then
            {
              echo "### Secret manquant — impossible de pousser le SHA rejoué"
              echo
              echo '```bash'
              echo "gh secret set FORK_PUSH_TOKEN --repo $GITHUB_REPOSITORY"
              echo '```'
              echo
              echo "PAT classic, scopes \`repo\` + \`workflow\`. GITHUB_TOKEN ne suffit pas."
            } >>"$GITHUB_STEP_SUMMARY"
            echo "::error::FORK_PUSH_TOKEN absent — gh secret set FORK_PUSH_TOKEN --repo $GITHUB_REPOSITORY"
            exit 1
          fi
          # Construit depuis $GITHUB_REPOSITORY : ce job ne peut pousser que sur
          # CE dépôt. Le remote `upstream` ajouté plus haut ne sert qu'au fetch.
          remote="https://x-access-token:${FORK_PUSH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"

          git push --force "$remote" "$patch_sha:refs/heads/$PATCH_BRANCH"
          # Le même SHA, immuable, pour que la release soit taggée sur l'arbre
          # exact qui a été testé et buildé.
          git push "$remote" "$sha:refs/tags/$tag"

  # ---------------------------------------------------------------------------
  # 2. Les deux répertoires que le patch touche, le typecheck complet, et le
  #    gate renderer : l'app construite doit booter sans qu'un error boundary
  #    tire. Les suites unitaires mockent le store ; un sélecteur qui alloue
  #    son snapshot (React #185, build 6feef259b9f5 : barre d'état vide, 4
  #    crashs/s) ne se voit qu'en app réelle. Le spec appartient au canal,
  #    pas à la branche perso : il garde ce qu'on livre, quelles que soient
  #    les branches.
  # ---------------------------------------------------------------------------
  test:
    needs: rebase
    if: needs.rebase.outputs.should_build == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      NODE_OPTIONS: --max-old-space-size=4096
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ needs.rebase.outputs.tag }}
          persist-credentials: false
      - uses: pnpm/action-setup@v6
        with:
          run_install: false
      - uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      # Le postinstall des modules natifs échoue avec la copie de node-gyp
      # embarquée par pnpm sur les runners Linux (cf. release-cut.yml amont).
      - name: node-gyp externe
        run: |
          npm install -g node-gyp@11.5.0
          echo "npm_config_node_gyp=$(npm root -g)/node-gyp/bin/node-gyp.js" >>"$GITHUB_ENV"
      - name: Install
        run: pnpm install --frozen-lockfile
      - name: Typecheck
        run: pnpm run typecheck
      # Ciblé, pas la suite entière : le patch ne touche que ces deux arbres
      # (12 fichiers), et une suite complète de ~2000 tests transformerait une
      # boucle nocturne en source de faux rouges venus d'ailleurs.
      - name: Tests orchestration + rpc
        run: |
          node config/scripts/ensure-native-runtime.mjs --runtime=node
          pnpm exec vitest run --config config/vitest.config.ts \
            src/main/runtime/orchestration src/main/runtime/rpc

      - name: Checkout la branche de pilotage (gate renderer)
        uses: actions/checkout@v6
        with:
          path: pipeline
          sparse-checkout: gates
          persist-credentials: false
      - name: Xvfb
        run: sudo apt-get update && sudo apt-get install -y xvfb
      - name: Gate renderer - boot sans crash de boundary
        run: |
          cp pipeline/gates/renderer-boot-crash-free.spec.ts tests/e2e/
          pnpm run ensure:electron-runtime
          xvfb-run --auto-servernum env ORCA_E2E_FORWARD_APP_LOGS=1 \
            pnpm exec playwright test tests/e2e/renderer-boot-crash-free.spec.ts \
              --config tests/playwright.config.ts --project electron-headless --workers=1

      # Le gate ci-dessus ne prouve que « ça boote ». C'est précisément ce qui
      # a laissé publier un binaire vert et amputé : sans les compteurs de
      # quota, l'app boote parfaitement. Ce gate-ci exécute les specs que la
      # source doit porter pour que les compteurs perso comptent comme livrés.
      # Ils appartiennent à la SOURCE, pas au canal : un spec de canal qui
      # réimplémenterait l'attente dériverait de l'app. `custom_state` décide
      # s'il s'applique — un canal nu assumé n'a aucun compteur perso à porter.
      - name: Gate perso - les compteurs de quota sont dans la source
        if: needs.rebase.outputs.custom_state == 'incorporated'
        run: |
          set -euo pipefail
          specs=()
          while read -r spec _rest; do
            case "${spec:-}" in
              ''|'#'*) continue ;;
            esac
            specs+=("$spec")
          done <pipeline/gates/custom-meter-specs.txt
          if [ "${#specs[@]}" -eq 0 ]; then
            echo "::error::pipeline/gates/custom-meter-specs.txt ne liste aucun spec — le gate perso ne garderait rien"
            exit 1
          fi
          absent=()
          for spec in "${specs[@]}"; do
            if [ ! -f "$spec" ]; then
              absent+=("$spec")
            fi
          done
          if [ "${#absent[@]}" -gt 0 ]; then
            {
              echo "### Source refusée — le spec des compteurs perso n'est pas dedans"
              echo
              echo "\`custom_state\` = \`incorporated\`, donc la source est censée porter"
              echo "les personnalisations. Ces specs sont absents de l'arbre buildé :"
              echo '```'
              for spec in "${absent[@]}"; do
                echo "$spec"
              done
              echo '```'
              echo "Soit la source n'est pas celle que tu crois, soit la liste de"
              echo "\`gates/custom-meter-specs.txt\` a vieilli (spec renommé)."
            } >>"$GITHUB_STEP_SUMMARY"
            echo "::error::spec(s) perso absent(s) de la source : $(echo "${absent[*]}")"
            exit 1
          fi
          xvfb-run --auto-servernum env ORCA_E2E_FORWARD_APP_LOGS=1 \
            pnpm exec playwright test "${specs[@]}" \
              --config tests/playwright.config.ts --project electron-headless --workers=1
      - name: Traces Playwright du gate
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-traces-gate-renderer
          path: test-results/
          retention-days: 7
          if-no-files-found: ignore

  # ---------------------------------------------------------------------------
  # 3a. macOS arm64, NON signé. La signature est refaite sur le Mac de Flo par
  #     update.sh, avec un certificat local dont la clé privée ne bouge pas :
  #     c'est lui qui porte les grants TCC, aucune CI ne peut le remplacer.
  # ---------------------------------------------------------------------------
  build-mac:
    needs: [rebase, test]
    runs-on: macos-15
    timeout-minutes: 90
    env:
      NODE_OPTIONS: --max-old-space-size=4096
      # La provenance inscrite dans l'artefact. `afterPack` d'electron-builder
      # écrit `Resources/orca-local-build.json` avec ce commit, et retombe
      # sinon sur `GITHUB_SHA` — qui vaut ici le sha de `fork-pipeline`, la
      # branche du WORKFLOW. Un artefact prétendait donc être buildé depuis un
      # commit de README. On inscrit le sha de la source réellement buildée,
      # celui que le tag porte.
      ORCA_BUILD_COMMIT: ${{ needs.rebase.outputs.sha }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ needs.rebase.outputs.tag }}
          persist-credentials: false
      - uses: pnpm/action-setup@v6
        with:
          run_install: false
      - uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - name: Cache electron-builder
        uses: actions/cache@v5
        with:
          path: |
            ~/Library/Caches/electron
            ~/Library/Caches/electron-builder
          key: electron-builder-mac-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: electron-builder-mac-
      - name: Install
        uses: nick-fields/retry@v4
        with:
          timeout_minutes: 15
          max_attempts: 3
          retry_wait_seconds: 30
          command: pnpm install --frozen-lockfile
      # local-build-switch.ts:25 refuse un build dont la version égale celle qui
      # tourne. Exportée pour les étapes suivantes : lue au require() de la config.
      - name: Version unique pour le canal local-build
        run: |
          set -euo pipefail
          version="$(node -e 'import("./config/scripts/build-mac-local.mjs").then(m=>console.log(m.getLocalBuildIdentity().version))')"
          test -n "$version"
          echo "ORCA_LOCAL_BUILD_VERSION=$version" >>"$GITHUB_ENV"
          echo "version du build mac : $version"
      # `build:release` construit aussi les trois helpers Swift (computer-use,
      # keyboard-layout, notification-status) que `mac.extraResources` /
      # `extraFiles` exigent : sans eux electron-builder échoue au packaging.
      # Aucun secret de télémétrie n'est fourni, donc ORCA_BUILD_IDENTITY reste
      # nul et le build est muet — ce qu'on veut d'un artefact non officiel.
      - name: Build
        run: pnpm build:release
      - name: Config electron-builder du canal fork
        run: |
          cat >config/electron-builder.fork.config.cjs <<'EOF'
          // Généré par fork-nightly.yml, jamais commité sur la branche patch.
          // Voir le README de `fork-pipeline`.
          const base = require('./electron-builder.config.cjs')
          module.exports = {
            ...base,
            // publish: null => aucun app-update.yml dans le bundle. Un build fork
            // qui interroge les releases d'upstream proposerait de s'écraser
            // lui-même avec l'officiel.
            publish: null,
            // Un seul artefact, nommé sans la version : update.sh et
            // versions.yml n'ont alors qu'un `kind` à connaître, pas un nom
            // qui change à chaque bump de package.json.
            mac: {
              ...base.mac,
              artifactName: 'orca-macos-${arch}.${ext}',
              target: [{ target: 'zip', arch: ['arm64'] }]
            }
          }
          EOF
          cat config/electron-builder.fork.config.cjs
      - name: Package (zip arm64, non signé)
        env:
          # Sans ça electron-builder irait chercher une identité Developer ID
          # dans le keychain du runner et échouerait sur son absence.
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
        run: pnpm exec electron-builder --config config/electron-builder.fork.config.cjs --mac zip --arm64 --publish never
      - name: Aucun app-update.yml dans l'artefact
        run: |
          set -euo pipefail
          zip="dist/orca-macos-arm64.zip"
          test -f "$zip" || { echo "::error::$zip absent"; ls -la dist; exit 1; }
          if unzip -l "$zip" | grep -q 'app-update\.yml'; then
            echo "::error::app-update.yml présent dans $zip — le build s'auto-updaterait vers l'officiel"
            exit 1
          fi
          echo "OK: pas d'app-update.yml. $(du -h "$zip")"
      - name: L'artefact dit de quelle source il vient
        env:
          EXPECTED_SHA: ${{ needs.rebase.outputs.sha }}
        run: |
          set -euo pipefail
          zip="dist/orca-macos-arm64.zip"
          # Le chemin exact dépend de `productName` ; on cherche le manifeste
          # où qu'il soit dans le bundle plutôt que de figer `Orca.app/`. `awk`
          # et non `grep | head` : sous `set -euo pipefail`, un manifeste
          # absent ferait sortir l'étape sur le code 1 de grep (ou un SIGPIPE
          # de head) AVANT le diagnostic juste en dessous.
          entry="$(unzip -Z1 "$zip" | awk '/\/Contents\/Resources\/orca-local-build\.json$/ && !found { print; found=1 }')"
          if [ -z "$entry" ]; then
            echo "::error::orca-local-build.json absent de $zip — l'artefact ne dit pas de quelle source il vient"
            exit 1
          fi
          commit="$(unzip -p "$zip" "$entry" | node -e 'let s="";process.stdin.on("data",c=>s+=c).on("end",()=>console.log(JSON.parse(s).commit??""))')"
          if [ "$commit" != "$EXPECTED_SHA" ]; then
            {
              echo "### Provenance de l'artefact incorrecte"
              echo
              echo "- attendu (source buildée, taggée) : \`$EXPECTED_SHA\`"
              echo "- inscrit dans \`$entry\` : \`$commit\`"
              echo
              echo "\`ORCA_BUILD_COMMIT\` n'a pas atteint \`afterPack\` : sans lui la"
              echo "config retombe sur \`GITHUB_SHA\`, le sha de \`fork-pipeline\`."
            } >>"$GITHUB_STEP_SUMMARY"
            echo "::error::provenance : l'artefact annonce « $commit » au lieu de $EXPECTED_SHA"
            exit 1
          fi
          echo "OK: l'artefact s'annonce buildé depuis $commit."
      - uses: actions/upload-artifact@v7
        with:
          name: mac-arm64
          path: dist/orca-macos-arm64.zip
          if-no-files-found: error
          retention-days: 7

  # ---------------------------------------------------------------------------
  # 3b. Linux amd64 .deb — ce que le VPS consomme (curl + dpkg).
  #
  # `ubuntu-latest` et non un conteneur `ubuntu:20.04` : c'est la recette de
  # release d'upstream (release-cut.yml, matrice `build`, `os: ubuntu-latest`).
  # Le plancher glibc 2.31 n'est pas tenu par l'image du runner mais par le hook
  # `afterPack` du packager — `verifyLinuxGlibcFloor`, dans
  # config/electron-builder.config.cjs — que la config dérivée hérite via
  # `...base` : un natif compilé contre un symbole plus récent fait échouer le
  # packaging, sur n'importe quel runner. Le conteneur 20.04 d'upstream sert à
  # un job de TESTS (`skill-sharing-linux-floor-release-gate`), pas au build.
  # ---------------------------------------------------------------------------
  build-linux:
    needs: [rebase, test]
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      NODE_OPTIONS: --max-old-space-size=4096
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ needs.rebase.outputs.tag }}
          persist-credentials: false
      - uses: pnpm/action-setup@v6
        with:
          run_install: false
      - uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - name: node-gyp externe
        run: |
          npm install -g node-gyp@11.5.0
          echo "npm_config_node_gyp=$(npm root -g)/node-gyp/bin/node-gyp.js" >>"$GITHUB_ENV"
      - name: Cache electron-builder
        uses: actions/cache@v5
        with:
          path: |
            ~/.cache/electron
            ~/.cache/electron-builder
          key: electron-builder-linux-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: electron-builder-linux-
      - name: Install
        uses: nick-fields/retry@v4
        with:
          timeout_minutes: 15
          max_attempts: 3
          retry_wait_seconds: 30
          command: pnpm install --frozen-lockfile
      # `build:release` vérifie le provider computer-use Linux en important les
      # bindings AT-SPI, absents des runners Ubuntu par défaut.
      - name: Dépendances du provider computer-use Linux
        run: sudo apt-get update && sudo apt-get install -y python3-gi gir1.2-atspi-2.0 at-spi2-core xclip xdotool
      - name: Build
        run: pnpm build:release
      - name: Config electron-builder du canal fork
        run: |
          cat >config/electron-builder.fork.config.cjs <<'EOF'
          // Généré par fork-nightly.yml, jamais commité. Voir README de fork-pipeline.
          const base = require('./electron-builder.config.cjs')
          module.exports = {
            ...base,
            // publish: null => aucun app-update.yml dans le paquet.
            publish: null
          }
          EOF
      - name: Package (.deb amd64)
        run: |
          node config/scripts/ensure-native-runtime.mjs --runtime=electron
          pnpm exec electron-builder --config config/electron-builder.fork.config.cjs --linux deb --x64 --publish never
      - name: Aucun app-update.yml dans l'artefact
        run: |
          set -euo pipefail
          deb="$(ls dist/*.deb)"
          if dpkg-deb -c "$deb" | grep -q 'app-update\.yml'; then
            echo "::error::app-update.yml présent dans $deb"
            exit 1
          fi
          echo "OK: pas d'app-update.yml. $(du -h "$deb")"
      - uses: actions/upload-artifact@v7
        with:
          name: linux-amd64
          path: dist/*.deb
          if-no-files-found: error
          retention-days: 7

  # ---------------------------------------------------------------------------
  # 4. Une release taggée, avec un sha256 par artefact. update.sh et
  #    sync-toolchain.ts vérifient ces sommes avant d'installer quoi que ce soit.
  # ---------------------------------------------------------------------------
  release:
    needs: [rebase, test, build-mac, build-linux]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v7
        with:
          path: assets
          merge-multiple: true
      - name: Publier la release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.rebase.outputs.tag }}
          SHA: ${{ needs.rebase.outputs.sha }}
          VERSION: ${{ needs.rebase.outputs.version }}
          IDENTITY: ${{ needs.rebase.outputs.identity }}
          UPSTREAM_SHA: ${{ needs.rebase.outputs.upstream_sha }}
          PATCH_SHA: ${{ needs.rebase.outputs.patch_sha }}
          MODE: ${{ needs.rebase.outputs.mode }}
          SOURCE_REF: ${{ needs.rebase.outputs.source_ref }}
          # `incorporated` / `bare` : lire une release et savoir si elle porte
          # les personnalisations. La release amputée du 1c642148c488 ne le
          # disait nulle part.
          CUSTOM_STATE: ${{ needs.rebase.outputs.custom_state }}
          CUSTOM_BRANCH_NAME: ${{ env.CUSTOM_BRANCH }}
        run: |
          set -euo pipefail
          cd assets
          ls -la
          # Un fichier de sommes, une somme par plateforme. Jamais une somme
          # unique pour deux artefacts : ce sont deux binaires différents.
          sha256sum ./* | sed 's| \./| |' >SHA256SUMS
          cat SHA256SUMS
          mac_sha="$(awk '/orca-macos-arm64\.zip$/{print $1}' SHA256SUMS)"
          deb_name="$(awk '/\.deb$/{print $2}' SHA256SUMS)"
          deb_sha="$(awk '/\.deb$/{print $1}' SHA256SUMS)"
          test -n "$mac_sha" && test -n "$deb_sha"

          # Hors du répertoire d'assets : tout ce qui traîne dedans finirait
          # attaché à la release.
          #
          # Rien n'est indenté sous le `if` : ces heredocs sont déjà à la
          # colonne 0 du script une fois le bloc YAML dépouillé, et un
          # terminateur décalé ne fermerait plus rien.
          if [ "$MODE" = "manual" ]; then
          cat >"$RUNNER_TEMP/notes.md" <<EOF
          Build **manuel** du canal fork : le ref \`$SOURCE_REF\` de ce dépôt,
          buildé tel quel. Pas de rebase, et la branche patch n'a pas été
          touchée.

          - source : \`$SOURCE_REF\` figé sur \`$SHA\`
          - personnalisations : \`$CUSTOM_STATE\` (\`${CUSTOM_BRANCH_NAME:-aucune}\`)
          - version electron-builder : \`$VERSION\`
          - source-identity: \`$IDENTITY\`
          EOF
          else
          cat >"$RUNNER_TEMP/notes.md" <<EOF
          Build automatique du canal fork — la branche patch rejouée sur
          \`upstream/main\` du jour, puis les personnalisations empilées.

          - upstream : \`$UPSTREAM_SHA\`
          - patch : \`$PATCH_SHA\`
          - personnalisations : \`$CUSTOM_STATE\` (\`${CUSTOM_BRANCH_NAME:-aucune}\`)
          - résultat : \`$SHA\` (branche \`fork-channel\`)
          - version electron-builder : \`$VERSION\`
          - source-identity: \`$IDENTITY\`
          EOF
          fi

          # Les sommes et le mode d'emploi d'installation ne dépendent pas du
          # chemin : un artefact manuel se vérifie et s'installe exactement
          # comme un artefact nocturne.
          cat >>"$RUNNER_TEMP/notes.md" <<EOF

          | artefact | sha256 |
          | --- | --- |
          | \`orca-macos-arm64.zip\` | \`$mac_sha\` |
          | \`$deb_name\` | \`$deb_sha\` |

          **Le zip macOS n'est pas signé.** Ne l'installe pas à la main :
          \`~/orca-fork/update.sh\` purge la quarantine et le re-signe avec le
          certificat local \`Orca Dev\` auquel les grants TCC sont épinglés.
          Un bundle installé sans cette étape perd tous ses accès fichiers.

          Le VPS consomme le \`.deb\` via \`sync-toolchain.ts --apply\`, qui
          vérifie le sha256 épinglé dans \`agent/versions.yml\`.
          EOF

          gh release create "$TAG" --repo "$GITHUB_REPOSITORY" \
            --title "$TAG" --notes-file "$RUNNER_TEMP/notes.md" \
            "orca-macos-arm64.zip" "$deb_name" SHA256SUMS
          echo "Release $TAG publiée." >>"$GITHUB_STEP_SUMMARY"
          gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json url --jq .url >>"$GITHUB_STEP_SUMMARY"

  # ---------------------------------------------------------------------------
  # 5. L'alerte. Elle ne rattrape rien : elle dit qu'une main humaine est
  #    nécessaire, le jour où le rebase ou le build cède.
  # ---------------------------------------------------------------------------
  alert:
    needs: [rebase, test, build-mac, build-linux, release]
    if: failure()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Telegram
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          REBASE: ${{ needs.rebase.result }}
          TESTS: ${{ needs.test.result }}
          MAC: ${{ needs.build-mac.result }}
          LINUX: ${{ needs.build-linux.result }}
          RELEASE: ${{ needs.release.result }}
        run: |
          set -euo pipefail
          text="Orca fork nightly ÉCHEC
          rebase=$REBASE tests=$TESTS mac=$MAC linux=$LINUX release=$RELEASE
          $RUN_URL"
          if [ "$REBASE" = "failure" ]; then
            text="$text
          Probable conflit de rebase : le résumé du run liste les fichiers."
          fi
          # Un canal d'alerte non branché ne vaut pas mieux que pas d'alerte : il
          # vaut moins, parce qu'il donne l'illusion d'une surveillance. On le dit
          # fort et on n'invente pas de destinataire par défaut. Le run reste
          # rouge de toute façon — c'est le job échoué qui porte le verdict.
          if [ -z "${TELEGRAM_BOT_TOKEN:-}" ] || [ -z "${TELEGRAM_CHAT_ID:-}" ]; then
            {
              echo "### Alerte Telegram NON envoyée — secret manquant"
              echo
              echo '```bash'
              echo "gh secret set TELEGRAM_BOT_TOKEN --repo $GITHUB_REPOSITORY"
              echo "gh secret set TELEGRAM_CHAT_ID  --repo $GITHUB_REPOSITORY"
              echo '```'
              echo
              echo "Message qui aurait été envoyé :"
              echo '```'
              echo "$text"
              echo '```'
            } >>"$GITHUB_STEP_SUMMARY"
            echo "::warning::TELEGRAM_BOT_TOKEN / TELEGRAM_CHAT_ID absents — alerte non envoyée"
            exit 0
          fi
          curl -fsS -o /dev/null \
            "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
            --data-urlencode "chat_id=${TELEGRAM_CHAT_ID}" \
            --data-urlencode "text=${text}"
          echo "Alerte Telegram envoyée." >>"$GITHUB_STEP_SUMMARY"
